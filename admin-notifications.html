<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Notifications - TikTok Shop
    </title>

    <!-- App Icon -->
<link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>

<!-- iPhone / iPad Home Screen Icon -->
<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="images/apple-touch-icon.png"
>

<!-- PWA Manifest -->
<link
    rel="manifest"
    href="manifest.json"
>

<!-- Mobile Web App -->
<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
>

<meta
    name="apple-mobile-web-app-title"
    content="TikTok Shop"
>

<meta
    name="theme-color"
    content="#000000"
>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         LUCIDE
    ====================================================== -->

    <script
        src="https://unpkg.com/lucide@latest"
    ></script>


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

   <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                "Inter",
                sans-serif;

            background:
                #f5f6f8;

            color:
                #1f2937;

            overflow:
                hidden;

        }


        button,
        input,
        textarea {

            font-family:
                inherit;

        }


        button {

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================================
           ADMIN SIDEBAR
        ====================================================== */

        #sidebar-container {

            position:
                relative;

            z-index:
                10000;

        }


        /* =====================================================
           MOBILE MENU
        ====================================================== */

        #menuButton {

            position:
                fixed;

            top:
                15px;

            left:
                15px;

            width:
                42px;

            height:
                42px;

            border:
                1px solid #e5e7eb;

            border-radius:
                10px;

            background:
                #ffffff;

            color:
                #111827;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            z-index:
                11000;

            box-shadow:
                0 5px 18px rgba(0,0,0,.08);

        }


        /* =====================================================
           PAGE
        ====================================================== */

        .notification-page {

            position:
                relative;

            display:
                flex;

            width:
                calc(100% - 250px);

            height:
                100vh;

            margin-left:
                250px;

            overflow:
                hidden;

            background:
                #f8fafc;

        }


        /* =====================================================
           USER SIDEBAR
        ====================================================== */

        .notification-sidebar {

            width:
                330px;

            height:
                100%;

            flex-shrink:
                0;

            display:
                flex;

            flex-direction:
                column;

            background:
                #ffffff;

            border-right:
                1px solid #e5e7eb;

            overflow:
                hidden;

        }


        /* =====================================================
           SIDEBAR HEADER
        ====================================================== */

        .notification-sidebar-header {

            padding:
                20px;

            border-bottom:
                1px solid #e5e7eb;

            background:
                #ffffff;

            flex-shrink:
                0;

        }


        .notification-sidebar-title {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                16px;

        }


        .notification-sidebar-title h2 {

            font-size:
                20px;

            font-weight:
                700;

            color:
                #111827;

        }


        .notification-admin-badge {

            padding:
                5px 9px;

            border-radius:
                999px;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                .4px;

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .notification-search {

            position:
                relative;

            width:
                100%;

        }


        .notification-search svg {

            position:
                absolute;

            left:
                12px;

            top:
                50%;

            width:
                17px;

            height:
                17px;

            transform:
                translateY(-50%);

            color:
                #9ca3af;

            pointer-events:
                none;

        }


        .notification-search input {

            width:
                100%;

            height:
                40px;

            padding:
                0 12px 0 38px;

            border:
                1px solid #e5e7eb;

            border-radius:
                10px;

            outline:
                none;

            background:
                #f9fafb;

            color:
                #111827;

            font-size:
                13px;

        }


        .notification-search input:focus {

            border-color:
                #9ca3af;

            background:
                #ffffff;

        }


        /* =====================================================
           USERS LIST
        ====================================================== */

        .notification-users {

            flex:
                1;

            min-height:
                0;

            overflow-y:
                auto;

            overflow-x:
                hidden;

        }


        .notification-users::-webkit-scrollbar {

            width:
                5px;

        }


        .notification-users::-webkit-scrollbar-thumb {

            background:
                #d1d5db;

            border-radius:
                10px;

        }


        /* =====================================================
           USER ITEM
        ====================================================== */

        .notification-user-item {

            width:
                100%;

            min-height:
                74px;

            padding:
                13px 16px;

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            border-bottom:
                1px solid #f1f2f4;

            background:
                #ffffff;

            cursor:
                pointer;

            transition:
                background .15s ease;

        }


        .notification-user-item:hover {

            background:
                #f8fafc;

        }


        .notification-user-item.active {

            background:
                #eef2f7;

        }


        /* =====================================================
           USER AVATAR
        ====================================================== */

        .notification-user-avatar {

            width:
                46px;

            height:
                46px;

            min-width:
                46px;

            border-radius:
                50%;

            background:
                #111827;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            font-size:
                15px;

            font-weight:
                700;

        }


        .notification-user-avatar img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;

        }


        /* =====================================================
           USER INFO
        ====================================================== */

        .notification-user-info {

            flex:
                1;

            min-width:
                0;

        }


        .notification-user-top {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                8px;

            margin-bottom:
                5px;

        }


        .notification-user-name {

            min-width:
                0;

            color:
                #111827;

            font-size:
                13px;

            font-weight:
                600;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .notification-user-last {

            color:
                #9ca3af;

            font-size:
                10px;

            white-space:
                nowrap;

        }


        .notification-user-preview {

            color:
                #9ca3af;

            font-size:
                11px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =====================================================
           UNREAD BADGE
        ====================================================== */

        .notification-unread {

            min-width:
                20px;

            height:
                20px;

            padding:
                0 5px;

            border-radius:
                999px;

            background:
                #ef4444;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                9px;

            font-weight:
                700;

        }


        .notification-unread.hidden {

            display:
                none;

        }


        /* =====================================================
           EMPTY USERS
        ====================================================== */

        .empty-users {

            padding:
                45px 20px;

            text-align:
                center;

            color:
                #9ca3af;

            font-size:
                12px;

            line-height:
                1.6;

        }


        /* =====================================================
           MAIN
        ====================================================== */

        .notification-main {

            flex:
                1;

            min-width:
                0;

            height:
                100%;

            display:
                flex;

            flex-direction:
                column;

            background:
                #f8fafc;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .notification-header {

            height:
                72px;

            min-height:
                72px;

            padding:
                0 22px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            flex-shrink:
                0;

        }


        .notification-recipient {

            min-width:
                0;

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        /* =====================================================
           TIKTOK SHOP LOGO
        ====================================================== */

        .tiktok-shop-logo {

            width:
                42px;

            height:
                42px;

            min-width:
                42px;

            border-radius:
                12px;

            background:
                #111111;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                19px;

            font-weight:
                800;

            position:
                relative;

            overflow:
                hidden;

        }


        .tiktok-shop-logo img {
    width: 34px;
    height: 34px;
    object-fit: contain;
    display: block;
    border-radius: 9px;
}


        .notification-recipient-name {

            color:
                #111827;

            font-size:
                14px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .notification-recipient-contact {

            margin-top:
                3px;

            color:
                #9ca3af;

            font-size:
                10px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =====================================================
           HEADER ACTION
        ====================================================== */

        .notification-header-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

        }


        .notification-icon-button {

            width:
                38px;

            height:
                38px;

            border:
                1px solid #e5e7eb;

            border-radius:
                9px;

            background:
                #ffffff;

            color:
                #6b7280;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

        }


        .notification-icon-button:hover {

            background:
                #f9fafb;

            color:
                #111827;

        }


        /* =====================================================
           HISTORY
        ====================================================== */

        .notification-history {

            flex:
                1;

            min-height:
                0;

            overflow-y:
                auto;

            padding:
                24px;

            background:
                #f8fafc;

        }


        .notification-history::-webkit-scrollbar {

            width:
                6px;

        }


        .notification-history::-webkit-scrollbar-thumb {

            background:
                #d1d5db;

            border-radius:
                10px;

        }


        /* =====================================================
           EMPTY HISTORY
        ====================================================== */

        .notification-empty {

            width:
                100%;

            height:
                100%;

            min-height:
                300px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            color:
                #9ca3af;

        }


        .notification-empty-icon {

            width:
                70px;

            height:
                70px;

            margin-bottom:
                15px;

            border-radius:
                50%;

            background:
                #e5e7eb;

            color:
                #6b7280;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        .notification-empty-icon svg {

            width:
                30px;

            height:
                30px;

        }


        .notification-empty h3 {

            margin-bottom:
                5px;

            color:
                #6b7280;

            font-size:
                15px;

            font-weight:
                700;

        }


        .notification-empty p {

            color:
                #9ca3af;

            font-size:
                11px;

        }


        /* =====================================================
           NOTIFICATION CARD
        ====================================================== */

        .notification-card {

            width:
                min(650px, 100%);

            margin:
                0 auto 16px;

            padding:
                18px;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                16px;

            box-shadow:
                0 4px 16px rgba(0,0,0,.04);

        }


        .notification-card-top {

            display:
                flex;

            align-items:
                flex-start;

            gap:
                12px;

        }


        .notification-card-logo {

            width:
                42px;

            height:
                42px;

            min-width:
                42px;

            border-radius:
                12px;

            background:
                #111111;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                20px;

            font-weight:
                800;

        }

        .notification-card-logo img {
    width: 34px;
    height: 34px;
    object-fit: contain;
    display: block;
    border-radius: 9px;
}


        .notification-card-content {

            flex:
                1;

            min-width:
                0;

        }


        .notification-card-title-row {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                12px;

        }


        .notification-card-title {

            color:
                #111827;

            font-size:
                14px;

            font-weight:
                700;

            line-height:
                1.4;

        }


        .notification-card-time {

            flex-shrink:
                0;

            color:
                #9ca3af;

            font-size:
                9px;

        }


       .notification-card-message {
    margin-top: 7px;
    color: #4b5563;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-line;
    word-break: break-word;
    text-align: left;
}


        .notification-card-image {

            width:
                100%;

            max-width:
                430px;

            max-height:
                300px;

            margin-top:
                13px;

            border-radius:
                12px;

            object-fit:
                contain;

            display:
                block;

            background:
                #f3f4f6;

        }


        .notification-card-link {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            margin-top:
                13px;

            padding:
                8px 12px;

            border-radius:
                8px;

            background:
                #111827;

            color:
                #ffffff;

            text-decoration:
                none;

            font-size:
                11px;

            font-weight:
                600;

        }


        .notification-card-link:hover {

            opacity:
                .9;

        }


        /* =====================================================
           UNREAD CARD
        ====================================================== */

        .notification-card.unread {

            border-color:
                #d1d5db;

        }


        .notification-card.unread::before {

            content:
                "";

            display:
                block;

            width:
                7px;

            height:
                7px;

            margin-bottom:
                8px;

            border-radius:
                50%;

            background:
                #ef4444;

        }


        /* =====================================================
           COMPOSER
        ====================================================== */

        .notification-composer {

            flex-shrink:
                0;

            padding:
                18px 22px 20px;

            background:
                #ffffff;

            border-top:
                1px solid #e5e7eb;

        }


        .composer-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                12px;

            color:
                #111827;

            font-size:
                13px;

            font-weight:
                700;

        }


        .composer-title svg {

            width:
                17px;

            height:
                17px;

        }


        .composer-row {

            display:
                flex;

            gap:
                10px;

            margin-bottom:
                10px;

        }


        .composer-input {

            width:
                100%;

            height:
                42px;

            padding:
                0 13px;

            border:
                1px solid #e5e7eb;

            border-radius:
                10px;

            outline:
                none;

            background:
                #f9fafb;

            color:
                #111827;

            font-size:
                12px;

        }


        .composer-input:focus {

            border-color:
                #9ca3af;

            background:
                #ffffff;

        }


        .composer-textarea {

            width:
                100%;

            min-height:
                85px;

            resize:
                vertical;

            padding:
                11px 13px;

            border:
                1px solid #e5e7eb;

            border-radius:
                10px;

            outline:
                none;

            background:
                #f9fafb;

            color:
                #111827;

            font-size:
                12px;

            line-height:
                1.5;

        }


        .composer-textarea:focus {

            border-color:
                #9ca3af;

            background:
                #ffffff;

        }


        .composer-bottom {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-top:
                10px;

        }


        .composer-tools {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

        }


        .tool-button {

            width:
                38px;

            height:
                38px;

            border:
                1px solid #e5e7eb;

            border-radius:
                9px;

            background:
                #ffffff;

            color:
                #6b7280;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

        }


        .tool-button:hover {

            background:
                #f9fafb;

            color:
                #111827;

        }


        .tool-button svg {

            width:
                18px;

            height:
                18px;

        }


        .selected-file {

            max-width:
                250px;

            color:
                #6b7280;

            font-size:
                10px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .send-notification-button {

            height:
                42px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                10px;

            background:
                #111827;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            cursor:
                pointer;

            font-size:
                12px;

            font-weight:
                700;

        }


        .send-notification-button:hover {

            opacity:
                .92;

        }


        .send-notification-button:disabled {

            opacity:
                .5;

            cursor:
                not-allowed;

        }


        /* =====================================================
           TOAST
        ====================================================== */

        .notification-toast {

            position:
                fixed;

            right:
                24px;

            bottom:
                24px;

            z-index:
                20000;

            min-width:
                240px;

            max-width:
                360px;

            padding:
                13px 16px;

            border-radius:
                10px;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                12px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.18);

            transform:
                translateY(20px);

            opacity:
                0;

            pointer-events:
                none;

            transition:
                .2s ease;

        }


        .notification-toast.show {

            transform:
                translateY(0);

            opacity:
                1;

        }


        .notification-toast.error {

            background:
                #dc2626;

        }


        .notification-toast.success {

            background:
                #111827;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 1000px) {

            .notification-page {

                width:
                    100%;

                margin-left:
                    0;

            }

            #menuButton {

                display:
                    flex;

            }

            .notification-sidebar {

                width:
                    290px;

            }

        }


        @media (max-width: 760px) {

            body {

                overflow:
                    hidden;

            }


            .notification-sidebar {

                position:
                    fixed;

                top:
                    0;

                left:
                    0;

                width:
                    320px;

                max-width:
                    86vw;

                height:
                    100vh;

                z-index:
                    12000;

                transform:
                    translateX(-100%);

                transition:
                    transform .2s ease;

                box-shadow:
                    8px 0 30px rgba(0,0,0,.12);

            }


            .notification-sidebar.mobile-show {

                transform:
                    translateX(0);

            }


            .notification-main {

                width:
                    100%;

            }


            .notification-header {

                padding-left:
                    70px;

            }


            .notification-history {

                padding:
                    16px;

            }


            .notification-composer {

                padding:
                    12px;

            }


            .composer-bottom {

                align-items:
                    stretch;

                flex-direction:
                    column;

            }


            .send-notification-button {

                width:
                    100%;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         ADMIN SIDEBAR
    ====================================================== -->

    <div
        id="sidebar-container"
    ></div>


    <!-- =====================================================
         MOBILE MENU
    ====================================================== -->

    <button
        id="menuButton"
        type="button"
        aria-label="Open admin menu"
    >

        <i

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           API
        ====================================================== */

        const API_BASE_URL =
            "/api/notifications";


        /* =====================================================
           STATE
        ====================================================== */

        let rooms = [];

        let currentUserId = "";

        let currentUser = null;

        let selectedImageData = "";


        /* =====================================================
           ELEMENT
        ====================================================== */

        function $(id) {

            return document.getElementById(
                id
            );

        }


        /* =====================================================
           TOKEN
        ====================================================== */

        function getToken() {

            const keys = [

                "tiktokShopToken",

                "tiktokShopJWT",

                "authToken",

                "token"

            ];


            for (
                const key of keys
            ) {

                const token =
                    localStorage.getItem(
                        key
                    );


                if (token) {

                    return token;

                }

            }


            return "";

        }


        /* =====================================================
           API FETCH
        ====================================================== */

        async function apiFetch(
            url,
            options = {}
        ) {

            const token =
                getToken();


            if (!token) {

                showToast(
                    "ไม่พบ Token กรุณาเข้าสู่ระบบ Admin ก่อน",
                    "error"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "auth.html?mode=login";

                    },
                    1200
                );


                throw new Error(
                    "No authentication token"
                );

            }


            const headers = {

                ...(options.headers || {}),

                Authorization:
                    `Bearer ${token}`

            };


            /*
            -----------------------------------------
            JSON body
            -----------------------------------------
            */

            if (
                options.body &&
                typeof options.body ===
                "string"
            ) {

                headers[
                    "Content-Type"
                ] =
                    "application/json";

            }


            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        headers
                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            }

            catch {

                data = {};

            }


            if (
                !response.ok
            ) {

                throw new Error(

                    data.message ||
                    `Request failed (${response.status})`

                );

            }


            return data;

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           FORMAT TIME
        ====================================================== */

        function formatTime(
            value
        ) {

            if (!value) {

                return "";

            }


            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleString(
                "th-TH",
                {
                    day: "2-digit",
                    month: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* =====================================================
           SHOW TOAST
        ====================================================== */

        let toastTimer = null;


        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                $("toast");


            toast.textContent =
                message;


            toast.className =
                `notification-toast show ${type}`;


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2500
                );

        }


        /* =====================================================
           REFRESH ICONS
        ====================================================== */

        function refreshIcons() {

            if (
                typeof lucide !==
                "undefined"
            ) {

                lucide.createIcons();

            }

        }


        /* =====================================================
           LOAD ROOMS
        ====================================================== */

        async function loadRooms() {

            try {

                const data =
                    await apiFetch(
                        `${API_BASE_URL}/admin/rooms`
                    );


                rooms =
                    data.rooms ||
                    [];


                renderRooms();


                /*
                -----------------------------------------
                ถ้ามี User ที่เลือกอยู่
                ให้โหลดประวัติใหม่
                -----------------------------------------
                */

                if (
                    currentUserId
                ) {

                    const exists =
                        rooms.some(
                            room =>
                                String(
                                    room.user?._id
                                ) ===
                                String(
                                    currentUserId
                                )
                        );


                    if (exists) {

                        await loadHistory(
                            currentUserId
                        );

                    }

                }

            }

            catch (error) {

                console.error(
                    "Load notification rooms error:",
                    error
                );


                $("usersList").innerHTML = `

                    <div class="empty-users">

                        ไม่สามารถโหลดรายชื่อผู้ใช้ได้

                        <br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* =====================================================
           RENDER ROOMS
        ====================================================== */

        function renderRooms() {

            const container =
                $("usersList");


            const search =
                $("searchUsers")
                    .value
                    .trim()
                    .toLowerCase();


            const filtered =
                rooms.filter(
                    room => {

                        const user =
                            room.user ||
                            {};

                        const name =
                            user.shopName ||
                            user.displayName ||
                            user.username ||
                            "";


                        const username =
                            user.username ||
                            "";


                        const contact =
                            user.contact ||
                            "";


                        const text =
                            `${name} ${username} ${contact}`
                                .toLowerCase();


                        return text.includes(
                            search
                        );

                    }
                );


            if (
                !filtered.length
            ) {

                container.innerHTML = `

                    <div class="empty-users">

                        ไม่พบผู้ใช้

                    </div>

                `;

                return;

            }


            container.innerHTML =
                filtered.map(
                    room =>
                        renderRoom(
                            room
                        )
                )
                .join("");


            refreshIcons();

        }


        /* =====================================================
           RENDER ROOM
        ====================================================== */

        function renderRoom(
            room
        ) {

            const user =
                room.user ||
                {};


            const userId =
                String(
                    user._id ||
                    ""
                );


            const name =
                user.shopName ||
                user.displayName ||
                user.username ||
                "User";


            const username =
                user.username ||
                "";


            const avatar =
                user.profileImage ||
                "";


            const last =
                room.lastNotification;


            const unread =
                Number(
                    room.unreadCount ||
                    0
                );


            let preview =
                last?.title ||
                "ยังไม่มีการแจ้งเตือน";


            if (
                last?.message
            ) {

                preview =
                    last.message;

            }


            const active =
                String(
                    currentUserId
                ) ===
                userId
                    ? "active"
                    : "";


            const initial =
                name
                    .charAt(0)
                    .toUpperCase();


            return `

                <div
                    class="notification-user-item ${active}"
                    data-user-id="${escapeHTML(userId)}"
                >

                    <div
                        class="notification-user-avatar"
                    >

                        ${
                            avatar
                                ? `
                                    <img
                                        src="${escapeHTML(avatar)}"
                                        alt=""
                                    >
                                `
                                : escapeHTML(
                                    initial
                                )
                        }

                    </div>


                    <div
                        class="notification-user-info"
                    >

                        <div
                            class="notification-user-top"
                        >

                            <div
                                class="notification-user-name"
                            >
                                ${escapeHTML(name)}
                            </div>


                            ${
                                unread > 0
                                    ? `
                                        <span
                                            class="notification-unread"
                                        >
                                            ${unread > 99 ? "99+" : unread}
                                        </span>
                                    `
                                    : ""
                            }

                        </div>


                        <div
                            class="notification-user-preview"
                        >
                            ${escapeHTML(preview)}
                        </div>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           OPEN USER
        ====================================================== */

        async function openUser(
            userId
        ) {

            currentUserId =
                String(
                    userId
                );


            const room =
                rooms.find(
                    item =>
                        String(
                            item.user?._id
                        ) ===
                        currentUserId
                );


            if (!room) {

                return;

            }


            currentUser =
                room.user;


            updateRecipientHeader();


            renderRooms();


            await loadHistory(
                currentUserId
            );


            if (
                window.innerWidth <=
                760
            ) {

                $("notificationUserSidebar")
                    .classList.remove(
                        "mobile-show"
                    );

            }

        }


        /* =====================================================
           UPDATE HEADER
        ====================================================== */

        function updateRecipientHeader() {

            if (!currentUser) {

                return;

            }


            const name =
                currentUser.shopName ||
                currentUser.displayName ||
                currentUser.username ||
                "User";


            const contact =
                currentUser.contact ||
                currentUser.username ||
                "";


            $("recipientName")
                .textContent =
                `ส่งถึง: ${name}`;


            $("recipientContact")
                .textContent =
                contact;

        }


        /* =====================================================
           LOAD HISTORY
        ====================================================== */

        async function loadHistory(
            userId
        ) {

            const container =
                $("notificationHistory");


            if (!userId) {

                return;

            }


            container.innerHTML = `

                <div class="notification-empty">

                    <div class="notification-empty-icon">

                        <i data-lucide="loader-circle"></i>

                    </div>

                    <h3>
                        กำลังโหลด
                    </h3>

                    <p>
                        กำลังโหลดประวัติการแจ้งเตือน...
                    </p>

                </div>

            `;


            refreshIcons();


            try {

                const data =
                    await apiFetch(
                        `${API_BASE_URL}/admin/${encodeURIComponent(userId)}`
                    );


                const notifications =
                    data.notifications ||
                    [];


                renderHistory(
                    notifications
                );

            }

            catch (error) {

                console.error(
                    "Load notification history error:",
                    error
                );


                container.innerHTML = `

                    <div class="notification-empty">

                        <div class="notification-empty-icon">

                            <i data-lucide="alert-circle"></i>

                        </div>

                        <h3>
                            โหลดข้อมูลไม่สำเร็จ
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;


                refreshIcons();

            }

        }


        /* =====================================================
           RENDER HISTORY
        ====================================================== */

        function renderHistory(
            notifications
        ) {

            const container =
                $("notificationHistory");


            if (
                !notifications.length
            ) {

                container.innerHTML = `

                    <div class="notification-empty">

                        <div class="notification-empty-icon">

                            <i data-lucide="bell-off"></i>

                        </div>

                        <h3>
                            ยังไม่มีการแจ้งเตือน
                        </h3>

                        <p>
                            เริ่มส่งการแจ้งเตือนให้ผู้ใช้คนนี้ได้เลย
                        </p>

                    </div>

                `;


                refreshIcons();

                return;

            }


            container.innerHTML =
                notifications
                    .map(
                        notification =>
                            renderNotification(
                                notification
                            )
                    )
                    .join("");


            refreshIcons();


            container.scrollTop =
                container.scrollHeight;

        }


        /* =====================================================
           RENDER NOTIFICATION
        ====================================================== */

        function renderNotification(
            notification
        ) {

            const title =
                notification.title ||
                "การแจ้งเตือน";


            const message =
                notification.message ||
                "";


            const imageUrl =
                notification.imageUrl ||
                "";


            const linkUrl =
                notification.linkUrl ||
                "";


            const unread =
                !notification.isRead;


            return `

                <article
                    class="notification-card ${unread ? "unread" : ""}"
                >

                    <div
                        class="notification-card-top"
                    >

                        <div
    class="notification-card-logo"
>

    <img
        src="images/logo.png"
        alt="TikTok Shop"
    >

</div>


                        <div
                            class="notification-card-content"
                        >

                            <div
                                class="notification-card-title-row"
                            >

                                <div
                                    class="notification-card-title"
                                >
                                    ${escapeHTML(title)}
                                </div>


                                <div
                                    class="notification-card-time"
                                >
                                    ${formatTime(
                                        notification.createdAt
                                    )}
                                </div>

                            </div>


                            ${
                                message
    ? `<div class="notification-card-message">${escapeHTML(message)}</div>`
    : ""
                            }


                            ${
                                imageUrl
                                    ? `
                                        <img
                                            class="notification-card-image"
                                            src="${escapeHTML(imageUrl)}"
                                            alt="Notification image"
                                            loading="lazy"
                                        >
                                    `
                                    : ""
                            }


                            ${
                                linkUrl
                                    ? `
                                        <a
                                            class="notification-card-link"
                                            href="${escapeHTML(linkUrl)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >

                                            <i data-lucide="external-link"></i>

                                            ดูรายละเอียด

                                        </a>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                </article>

            `;

        }


        /* =====================================================
           IMAGE TO DATA URL
        ====================================================== */

        function readImageAsDataURL(
            file
        ) {

            return new Promise(
                function(
                    resolve,
                    reject
                ) {

                    const reader =
                        new FileReader();


                    reader.onload =
                        function() {

                            resolve(
                                reader.result
                            );

                        };


                    reader.onerror =
                        function() {

                            reject(
                                new Error(
                                    "ไม่สามารถอ่านรูปภาพได้"
                                )
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        /* =====================================================
           SELECT IMAGE
        ====================================================== */

        async function handleImageSelect(
            file
        ) {

            if (!file) {

                return;

            }


            const allowedTypes = [

                "image/png",

                "image/jpeg",

                "image/jpg",

                "image/webp",

                "image/gif"

            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                showToast(
                    "รองรับเฉพาะ PNG, JPG, WEBP และ GIF",
                    "error"
                );


                $("imageInput").value =
                    "";


                return;

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                showToast(
                    "รูปภาพต้องมีขนาดไม่เกิน 5MB",
                    "error"
                );


                $("imageInput").value =
                    "";


                return;

            }


            try {

                selectedImageData =
                    await readImageAsDataURL(
                        file
                    );


                $("selectedFile")
                    .textContent =
                    file.name;


            }

            catch (error) {

                console.error(
                    error
                );


                selectedImageData =
                    "";


                $("selectedFile")
                    .textContent =
                    "ยังไม่ได้เลือกรูป";

            }

        }


        /* =====================================================
           SEND NOTIFICATION
        ====================================================== */

        async function sendNotification() {

            if (!currentUserId) {

                showToast(
                    "กรุณาเลือกผู้ใช้ก่อน",
                    "error"
                );


                return;

            }


            const title =
                $("notificationTitle")
                    .value
                    .trim();


            const message =
                $("notificationMessage")
                    .value
                    .trim();


            const linkUrl =
                $("notificationLink")
                    .value
                    .trim();


            if (!title) {

                showToast(
                    "กรุณาใส่หัวข้อการแจ้งเตือน",
                    "error"
                );


                $("notificationTitle")
                    .focus();


                return;

            }


            const button =
                $("sendButton");


            button.disabled =
                true;


            button.innerHTML = `

                <i data-lucide="loader-circle"></i>

                <span>
                    กำลังส่ง...
                </span>

            `;


            refreshIcons();


            try {

                const data =
                    await apiFetch(
                        `${API_BASE_URL}/admin/send`,
                        {

                            method:
                                "POST",

                            body:
                                JSON.stringify({

                                    recipientId:
                                        currentUserId,

                                    title:
                                        title,

                                    message:
                                        message,

                                    imageData:
                                        selectedImageData,

                                    linkUrl:
                                        linkUrl,

                                    type:
                                        "manual"

                                })

                        }
                    );


                showToast(
                    data.message ||
                    "ส่งการแจ้งเตือนแล้ว",
                    "success"
                );


                /*
                -----------------------------------------
                Clear composer
                -----------------------------------------
                */

                $("notificationTitle")
                    .value =
                    "";


                $("notificationMessage")
                    .value =
                    "";


                $("notificationLink")
                    .value =
                    "";


                $("imageInput")
                    .value =
                    "";


                selectedImageData =
                    "";


                $("selectedFile")
                    .textContent =
                    "ยังไม่ได้เลือกรูป";


                /*
                -----------------------------------------
                Reload
                -----------------------------------------
                */

                await loadRooms();

                await loadHistory(
                    currentUserId
                );

            }

            catch (error) {

                console.error(
                    "Send notification error:",
                    error
                );


                showToast(
                    error.message ||
                    "ส่งการแจ้งเตือนไม่สำเร็จ",
                    "error"
                );

            }

            finally {

                button.disabled =
                    false;


                button.innerHTML = `

                    <i data-lucide="send"></i>

                    <span>
                        ส่งการแจ้งเตือน
                    </span>

                `;


                refreshIcons();

                updateSendButton();

            }

        }


        /* =====================================================
           UPDATE SEND BUTTON
        ====================================================== */

        function updateSendButton() {

            const title =
                $("notificationTitle")
                    .value
                    .trim();


            $("sendButton").disabled =
                !currentUserId ||
                !title;

        }


        /* =====================================================
           ROOM CLICK
        ====================================================== */

        $("usersList")
            .addEventListener(
                "click",
                function(event) {

                    const item =
                        event.target.closest(
                            ".notification-user-item"
                        );


                    if (!item) {

                        return;

                    }


                    const userId =
                        item.dataset.userId;


                    if (!userId) {

                        return;

                    }


                    openUser(
                        userId
                    );

                }
            );


        /* =====================================================
           SEARCH
        ====================================================== */

        $("searchUsers")
            .addEventListener(
                "input",
                function() {

                    renderRooms();

                }
            );


        /* =====================================================
           SEND BUTTON
        ====================================================== */

        $("sendButton")
            .addEventListener(
                "click",
                function() {

                    sendNotification();

                }
            );


        /* =====================================================
           TITLE INPUT
        ====================================================== */

        $("notificationTitle")
            .addEventListener(
                "input",
                updateSendButton
            );


        /* =====================================================
           IMAGE BUTTON
        ====================================================== */

        $("imageButton")
            .addEventListener(
                "click",
                function() {

                    $("imageInput")
                        .click();

                }
            );


        /* =====================================================
           IMAGE INPUT
        ====================================================== */

        $("imageInput")
            .addEventListener(
                "change",
                async function() {

                    const file =
                        this.files &&
                        this.files[0];


                    await handleImageSelect(
                        file
                    );

                }
            );


        /* =====================================================
           REFRESH
        ====================================================== */

        $("refreshButton")
            .addEventListener(
                "click",
                async function() {

                    await loadRooms();

                    if (
                        currentUserId
                    ) {

                        await loadHistory(
                            currentUserId
                        );

                    }

                }
            );


        /* =====================================================
           MOBILE MENU
        ====================================================== */

        $("menuButton")
            .addEventListener(
                "click",
                function() {

                    const sidebar =
                        $("notificationUserSidebar");


                    if (!sidebar) {

                        return;

                    }


                    sidebar.classList.toggle(
                        "mobile-show"
                    );

                }
            );


        /* =====================================================
           ESC
        ====================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    $("notificationUserSidebar")
                        .classList.remove(
                            "mobile-show"
                        );

                }

            }
        );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                refreshIcons();

                await loadRooms();

                updateSendButton();

            }
        );

    </script>


    <!-- =====================================================
         ADMIN SIDEBAR JS
    ====================================================== -->

    <script
        src="js/admin-sidebar.js"
    ></script>


</body>

</html>

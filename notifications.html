    <script>

        /* =====================================================
           API
        ====================================================== */

        const API_BASE_URL =
            "/api/notifications";


        /* =====================================================
           STATE
        ====================================================== */

        let notifications = [];


        /* =====================================================
           GET TOKEN
        ====================================================== */

        function getToken() {

            const keys = [

                "tiktokShopToken",

                "tiktokShopJWT",

                "authToken",

                "token"

            ];


            for (
                const key of keys
            ) {

                const token =
                    localStorage.getItem(
                        key
                    );


                if (token) {

                    return token;

                }

            }


            return "";

        }


        /* =====================================================
           API FETCH
        ====================================================== */

        async function apiFetch(
            url,
            options = {}
        ) {

            const token =
                getToken();


            if (!token) {

                throw new Error(
                    "ไม่พบ Token กรุณาเข้าสู่ระบบก่อน"
                );

            }


            const headers = {

                ...(options.headers || {}),

                Authorization:
                    `Bearer ${token}`

            };


            if (
                options.body &&
                typeof options.body ===
                "string"
            ) {

                headers[
                    "Content-Type"
                ] =
                    "application/json";

            }


            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        headers
                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            }

            catch {

                data = {};

            }


            if (!response.ok) {

                throw new Error(

                    data.message ||
                    `Request failed (${response.status})`

                );

            }


            return data;

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           SAFE URL
        ====================================================== */

        function safeURL(
            value
        ) {

            const raw =
                String(
                    value ?? ""
                ).trim();


            if (!raw) {

                return "";

            }


            /*
            -----------------------------------------
            รองรับ URL แบบ absolute
            -----------------------------------------
            */

            try {

                const url =
                    new URL(
                        raw,
                        window.location.origin
                    );


                if (
                    url.protocol ===
                    "http:" ||
                    url.protocol ===
                    "https:"
                ) {

                    return url.href;

                }

            }

            catch {

                return "";

            }


            return "";

        }


        /* =====================================================
           FORMAT DATE
        ====================================================== */

        function formatDate(
            value
        ) {

            if (!value) {

                return "";

            }


            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleString(
                "th-TH",
                {

                    day:
                        "2-digit",

                    month:
                        "2-digit",

                    year:
                        "numeric",

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"

                }
            );

        }


        /* =====================================================
           TOAST
        ====================================================== */

        let toastTimer = null;


        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.className =
                `notification-toast show ${type}`;


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2500
                );

        }


        /* =====================================================
           LUCIDE
        ====================================================== */

        function refreshIcons() {

            if (
                typeof lucide !==
                "undefined"
            ) {

                lucide.createIcons();

            }

        }


        /* =====================================================
           LOAD NOTIFICATIONS
        ====================================================== */

        async function loadNotifications() {

            const list =
                document.getElementById(
                    "notificationsList"
                );


            list.innerHTML = `

                <div class="notifications-empty">

                    <div class="notifications-empty-icon">

                        <i data-lucide="loader-circle"></i>

                    </div>

                    <h3>
                        กำลังโหลด
                    </h3>

                    <p>
                        กำลังโหลดการแจ้งเตือนของคุณ...
                    </p>

                </div>

            `;


            refreshIcons();


            try {

                const data =
                    await apiFetch(
                        API_BASE_URL
                    );


                notifications =
                    Array.isArray(
                        data.notifications
                    )
                        ? data.notifications
                        : [];


                renderNotifications();


                await updateUnreadCount();


            }

            catch (error) {

                console.error(
                    "Load notifications error:",
                    error
                );


                list.innerHTML = `

                    <div class="notifications-empty">

                        <div class="notifications-empty-icon">

                            <i data-lucide="alert-circle"></i>

                        </div>

                        <h3>
                            โหลดการแจ้งเตือนไม่สำเร็จ
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;


                refreshIcons();


                document.getElementById(
                    "notificationSubtitle"
                ).textContent =
                    "ไม่สามารถโหลดข้อมูลได้";

            }

        }


        /* =====================================================
           RENDER NOTIFICATIONS
        ====================================================== */

        function renderNotifications() {

            const list =
                document.getElementById(
                    "notificationsList"
                );


            if (
                !notifications.length
            ) {

                list.innerHTML = `

                    <div class="notifications-empty">

                        <div class="notifications-empty-icon">

                            <i data-lucide="bell-off"></i>

                        </div>

                        <h3>
                            ยังไม่มีการแจ้งเตือน
                        </h3>

                        <p>
                            เมื่อมีการแจ้งเตือนใหม่ จะแสดงที่หน้านี้
                        </p>

                    </div>

                `;


                document.getElementById(
                    "notificationSubtitle"
                ).textContent =
                    "ไม่มีการแจ้งเตือน";


                refreshIcons();

                return;

            }


            list.innerHTML =
                notifications
                    .map(
                        notification =>
                            renderNotification(
                                notification
                            )
                    )
                    .join("");


            const unread =
                notifications.filter(
                    item =>
                        !item.isRead
                ).length;


            document.getElementById(
                "notificationSubtitle"
            ).textContent =
                `${notifications.length} รายการ`;


            document.getElementById(
                "unreadCount"
            ).textContent =
                unread;


            refreshIcons();

        }


        /* =====================================================
           RENDER ONE
        ====================================================== */

        function renderNotification(
            notification
        ) {

            const isUnread =
                !notification.isRead;


            const title =
                notification.title ||
                "การแจ้งเตือน";


            const message =
                notification.message ||
                "";


            const imageUrl =
                safeURL(
                    notification.imageUrl
                );


            const linkUrl =
                safeURL(
                    notification.linkUrl
                );


            return `

                <article
                    class="user-notification ${isUnread ? "unread" : ""}"
                    data-notification-id="${escapeHTML(
                        notification._id || ""
                    )}"
                >


                    <div
                        class="user-notification-top"
                    >


                        <div
                            class="notification-logo"
                        >

                            <img
                                src="images/logo.png"
                                alt="TikTok Shop"
                            >

                        </div>


                        <div
                            class="notification-content"
                        >


                            <div
                                class="notification-title-row"
                            >

                                <div
                                    class="notification-title"
                                >
                                    ${escapeHTML(
                                        title
                                    )}
                                </div>


                                <div
                                    class="notification-time"
                                >
                                    ${formatDate(
                                        notification.createdAt
                                    )}
                                </div>

                            </div>


                            ${
                                message
                                    ? `
                                        <div
                                            class="notification-message"
                                        >${escapeHTML(
                                            message
                                        )}</div>
                                    `
                                    : ""
                            }


                            ${
                                imageUrl
                                    ? `
                                        <img
                                            class="notification-image"
                                            src="${escapeHTML(
                                                imageUrl
                                            )}"
                                            alt="รูปภาพการแจ้งเตือน"
                                            loading="lazy"
                                        >
                                    `
                                    : ""
                            }


                            ${
                                linkUrl
                                    ? `
                                        <a
                                            class="notification-link"
                                            href="${escapeHTML(
                                                linkUrl
                                            )}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            data-notification-link="true"
                                        >

                                            <i
                                                data-lucide="external-link"
                                            ></i>

                                            ดูรายละเอียด

                                        </a>
                                    `
                                    : ""
                            }


                            ${
                                isUnread
                                    ? `
                                        <div
                                            class="unread-badge"
                                        >
                                            ยังไม่ได้อ่าน
                                        </div>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                </article>

            `;

        }


        /* =====================================================
           GET UNREAD COUNT
        ====================================================== */

        async function updateUnreadCount() {

            try {

                const data =
                    await apiFetch(
                        `${API_BASE_URL}/unread-count`
                    );


                const count =
                    Number(
                        data.count || 0
                    );


                document.getElementById(
                    "unreadCount"
                ).textContent =
                    count;


                /*
                -----------------------------------------
                อัปเดต badge ที่กระดิ่งด้วย
                -----------------------------------------
                */

                if (
                    window
                        .TikTokShopNotifications &&
                    typeof window
                        .TikTokShopNotifications
                        .updateBadge ===
                        "function"
                ) {

                    window
                        .TikTokShopNotifications
                        .updateBadge(
                            count
                        );

                }


                return count;

            }

            catch (error) {

                console.warn(
                    "Unread count error:",
                    error.message
                );


                return 0;

            }

        }


        /* =====================================================
           MARK ONE AS READ
        ====================================================== */

        async function markAsRead(
            notificationId
        ) {

            if (!notificationId) {

                return;

            }


            try {

                await apiFetch(

                    `${API_BASE_URL}/${encodeURIComponent(
                        notificationId
                    )}/read`,

                    {
                        method:
                            "PATCH"
                    }

                );


                /*
                -----------------------------------------
                Update local state
                -----------------------------------------
                */

                const notification =
                    notifications.find(
                        item =>
                            String(
                                item._id
                            ) ===
                            String(
                                notificationId
                            )
                    );


                if (notification) {

                    notification.isRead =
                        true;

                    notification.readAt =
                        new Date()
                            .toISOString();

                }


                renderNotifications();


                await updateUnreadCount();

            }

            catch (error) {

                console.error(
                    "Mark notification read error:",
                    error
                );

            }

        }


        /* =====================================================
           MARK ALL AS READ
        ====================================================== */

        async function markAllAsRead() {

            const unreadCount =
                notifications.filter(
                    item =>
                        !item.isRead
                ).length;


            if (
                unreadCount <= 0
            ) {

                showToast(
                    "ไม่มีแจ้งเตือนที่ยังไม่ได้อ่าน"
                );


                return;

            }


            const button =
                document.getElementById(
                    "readAllButton"
                );


            button.disabled =
                true;


            try {

                await apiFetch(

                    `${API_BASE_URL}/read-all`,

                    {
                        method:
                            "PATCH"
                    }

                );


                notifications =
                    notifications.map(
                        item => ({

                            ...item,

                            isRead:
                                true,

                            readAt:
                                new Date()
                                    .toISOString()

                        })
                    );


                renderNotifications();


                await updateUnreadCount();


                showToast(
                    "อ่านการแจ้งเตือนทั้งหมดแล้ว"
                );

            }

            catch (error) {

                console.error(
                    "Mark all notifications read error:",
                    error
                );


                showToast(
                    error.message ||
                    "ไม่สามารถอ่านทั้งหมดได้",
                    "error"
                );

            }

            finally {

                button.disabled =
                    false;

            }

        }


        /* =====================================================
           NOTIFICATION CLICK
        ====================================================== */

        async function handleNotificationClick(
            event
        ) {

            /*
            -----------------------------------------
            ถ้าคลิก Link
            ให้ Link ทำงานตามปกติ
            -----------------------------------------
            */

            const link =
                event.target.closest(
                    "a"
                );


            if (link) {

                return;

            }


            const card =
                event.target.closest(
                    ".user-notification"
                );


            if (!card) {

                return;

            }


            const notificationId =
                card.dataset
                    .notificationId;


            if (!notificationId) {

                return;

            }


            const notification =
                notifications.find(
                    item =>
                        String(
                            item._id
                        ) ===
                        String(
                            notificationId
                        )
                );


            if (!notification) {

                return;

            }


            /*
            -----------------------------------------
            ถ้ายังไม่ได้อ่าน
            -----------------------------------------
            */

            if (
                !notification.isRead
            ) {

                await markAsRead(
                    notificationId
                );

            }

        }


        /* =====================================================
           BACK
        ====================================================== */

        function goBack() {

            /*
            -----------------------------------------
            ถ้ามี history
            -----------------------------------------
            */

            if (
                window.history.length >
                1
            ) {

                window.history.back();

                return;

            }


            window.location.href =
                "index.html";

        }


        /* =====================================================
           EVENTS
        ====================================================== */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                goBack
            );


        document
            .getElementById(
                "readAllButton"
            )
            .addEventListener(
                "click",
                markAllAsRead
            );


        document
            .getElementById(
                "notificationsList"
            )
            .addEventListener(
                "click",
                handleNotificationClick
            );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                refreshIcons();

                await loadNotifications();

            }
        );


        /* =====================================================
           AUTO REFRESH
           ทุก 10 วินาที
        ====================================================== */

        setInterval(
            async function() {

                /*
                -----------------------------------------
                ถ้าหน้านี้ยังเปิดอยู่
                -----------------------------------------
                */

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    await loadNotifications();

                }

            },
            10000
        );


    </script>


    <!-- =====================================================
         GLOBAL NOTIFICATION JS
    ====================================================== -->

    <script
        src="js/notifications.js"
    ></script>


</body>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Shop Order | TikTok Shop</title>

    <!-- App Icon -->
<link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>

<!-- iPhone / iPad Home Screen Icon -->
<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="images/apple-touch-icon.png"
>

<!-- PWA Manifest -->
<link
    rel="manifest"
    href="manifest.json"
>

<!-- Mobile Web App -->
<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
>

<meta
    name="apple-mobile-web-app-title"
    content="TikTok Shop"
>

<meta
    name="theme-color"
    content="#000000"
>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f6f6f7; color: #111; font-family: Inter, sans-serif; }
        button, input, textarea { font-family: inherit; }
        button { cursor: pointer; }
        .main-content { min-height: 100vh; margin-left: 250px; }
        .page { padding: 32px; max-width: 1500px; margin: 0 auto; }
        .page-header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
        .page-header h1 { margin:0; font-size:28px; font-weight:800; }
        .page-header p { margin:7px 0 0; color:#777; font-size:13px; }
        .header-badge { display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid #e5e5e7; background:#fff; border-radius:10px; color:#555; font-size:12px; }
        .layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; }
        .panel { background:#fff; border:1px solid #e6e6e8; border-radius:16px; box-shadow:0 6px 25px rgba(0,0,0,.04); overflow:hidden; }
        .panel-head { padding:18px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .panel-head h2 { margin:0; font-size:15px; font-weight:800; }
        .panel-head span { color:#999; font-size:11px; }
        .search { margin:14px; position:relative; }
        .search i { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; color:#999; }
        .search input { width:100%; padding:10px 12px 10px 35px; border:1px solid #ddd; border-radius:10px; outline:none; font-size:12px; }
        .search input:focus { border-color:#999; }
        .shop-list { max-height:calc(100vh - 230px); overflow:auto; padding:0 10px 12px; }
        .shop-card { width:100%; border:1px solid transparent; background:#fff; border-radius:12px; padding:12px; display:flex; align-items:center; gap:11px; text-align:left; margin-bottom:6px; }
        .shop-card:hover { background:#f8f8f9; }
        .shop-card.active { background:#f3f3f4; border-color:#ddd; }
        .avatar { width:42px; height:42px; border-radius:50%; background:#171717; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; overflow:hidden; flex-shrink:0; }
        .avatar img { width:100%; height:100%; object-fit:cover; }
        .shop-info { min-width:0; flex:1; }
        .shop-info strong { display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .shop-info span { display:block; color:#999; font-size:10px; margin-top:3px; }
        .shop-count { font-size:10px; color:#777; white-space:nowrap; }
        .content { min-width:0; }
        .selected-shop { padding:18px 20px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px; }
        .selected-shop .avatar { width:48px; height:48px; }
        .selected-shop strong { font-size:15px; display:block; }
        .selected-shop span { display:block; margin-top:4px; color:#888; font-size:11px; }
        .products { padding:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
        .product-card { border:1px solid #e7e7e9; border-radius:13px; overflow:hidden; background:#fff; cursor:pointer; transition:.18s; }
        .product-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.06); }
        .product-card.selected { border-color:#111; box-shadow:0 0 0 2px #111 inset; }
        .product-image { height:170px; background:#f4f4f5; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .product-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 8px;

    display: block;
}


.selected-product img {
    width: 64px;
    height: 64px;

    object-fit: contain;

    padding: 4px;

    border-radius: 10px;

    background: #eee;
}
        .product-body { padding:12px; }
        .product-name { font-size:12px; font-weight:700; line-height:1.4; min-height:34px; }
        .product-meta { margin-top:8px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
        .price { font-weight:800; font-size:14px; }
        .stock { color:#888; font-size:10px; }
        .order-panel { margin:0 20px 20px; border:1px solid #e5e5e7; border-radius:14px; background:#fafafa; padding:18px; }
        .order-panel h3 { margin:0 0 14px; font-size:14px; }
        .selected-product { display:flex; gap:12px; padding-bottom:15px; margin-bottom:15px; border-bottom:1px solid #e5e5e7; }
        .selected-product img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    padding: 4px;
    border-radius: 10px;
    background: #eee;
}
        .selected-product strong { font-size:13px; display:block; }
        .selected-product span { color:#777; font-size:11px; display:block; margin-top:4px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .field.full { grid-column:1/-1; }
        .field label { display:block; margin-bottom:6px; font-size:11px; font-weight:700; }
        .field input, .field textarea { width:100%; border:1px solid #ddd; border-radius:9px; padding:10px 11px; background:#fff; outline:none; font-size:12px; }
        .field textarea { min-height:80px; resize:vertical; }
        .field input:focus, .field textarea:focus { border-color:#999; }
        .quantity-row { display:flex; align-items:center; gap:10px; }
        .quantity-row button { width:34px; height:34px; border:1px solid #ddd; background:#fff; border-radius:8px; font-size:18px; }
        .quantity-row input { text-align:center; max-width:90px; }
        .summary { margin-top:15px; display:flex; justify-content:space-between; align-items:center; gap:15px; }
        .total strong { font-size:20px; }
        .primary { border:0; border-radius:10px; padding:11px 18px; background:#111; color:#fff; font-weight:800; font-size:12px; }
        .primary:disabled { opacity:.4; cursor:not-allowed; }
        .empty { padding:50px 20px; text-align:center; color:#999; grid-column:1/-1; }
        .empty i { width:32px; height:32px; margin-bottom:10px; }
        .empty strong { display:block; color:#555; font-size:13px; }
        .empty span { display:block; font-size:11px; margin-top:5px; }
        .toast { position:fixed; left:50%; bottom:25px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#111; color:#fff; padding:11px 15px; border-radius:10px; font-size:12px; transition:.2s; z-index:30000; }
        .toast.show { opacity:1; transform:translate(-50%,0); }
        .toast.error { background:#b42318; }
        @media(max-width:900px) { .main-content { margin-left:0; } .page { padding:22px 15px 40px; } .layout { grid-template-columns:1fr; } .shop-list { max-height:330px; } }
        @media(max-width:600px) { .page-header { flex-direction:column; } .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .products { padding:14px; grid-template-columns:repeat(2,minmax(0,1fr)); } .product-image { height:140px; } .order-panel { margin:0 14px 14px; } }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="page">
            <div class="page-header">
                <div>
                    <h1>สั่งซื้อสินค้า</h1>
                    <p>เลือกดูร้านของผู้ใช้ เลือกสินค้า และสร้างออเดอร์ส่งเข้าร้านโดยตรง</p>
                </div>
                <div class="header-badge">
                    <i data-lucide="shield-check"></i>
                    Admin Order Center
                </div>
            </div>

            <div class="layout">
                <section class="panel">
                    <div class="panel-head">
                        <h2>ร้านค้าผู้ใช้</h2>
                        <span id="shopCount">0 ร้าน</span>
                    </div>
                    <div class="search">
                        <i data-lucide="search"></i>
                        <input id="shopSearch" type="search" placeholder="ค้นหาชื่อร้าน / username">
                    </div>
                    <div class="shop-list" id="shopList"></div>
                </section>

                <section class="panel content">
                    <div id="selectedShop" class="selected-shop" style="display:none"></div>
                    <div id="products" class="products">
                        <div class="empty">
                            <i data-lucide="store"></i>
                            <strong>เลือกร้านค้าก่อน</strong>
                            <span>เมื่อเลือกร้านแล้ว ระบบจะแสดงสินค้าของร้านนี้</span>
                        </div>
                    </div>

                    <div class="order-panel" id="orderPanel" style="display:none">
                        <h3>ข้อมูลออเดอร์</h3>
                        <div id="selectedProduct"></div>
                        <div class="form-grid">
                            <div class="field">

    <label>
        จำนวนสินค้า
    </label>

    <div class="quantity-row">

        <button
            type="button"
            id="minusButton"
        >
            −
        </button>


        <input
            id="quantity"
            type="number"
            min="1"
            value="1"
        >


        <button
            type="button"
            id="plusButton"
        >
            +
        </button>

    </div>

</div>


<div class="field">

    <label>
        ชื่อผู้ซื้อ
        <span style="color:#c00">*</span>
    </label>

    <input
        id="buyerName"
        type="text"
        placeholder="กรอกชื่อผู้ซื้อ"
    >

</div>


<div class="field">

    <label>
        เบอร์โทรจัดส่ง
    </label>

    <input
        id="shippingPhone"
        type="text"
        placeholder="กรอกเบอร์โทร"
    >

</div>
                            <div class="field full">
                                <label>ข้อมูลจัดส่ง / ที่อยู่ฝากของ <span style="color:#c00">*</span></label>
                                <textarea id="shippingAddress" placeholder="ชื่อผู้รับ, บ้านเลขที่, ถนน, เมือง, ประเทศ หรือรายละเอียดจุดรับของ"></textarea>
                            </div>
                            <div class="field full">
                                <label>หมายเหตุถึงร้าน</label>
                                <textarea id="buyerNote" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
                            </div>
                        </div>
                        <div class="summary">
                            <div class="total">ยอดออเดอร์ <strong id="total">$0.00</strong></div>
                            <button class="primary" id="buyButton" type="button" disabled>
                                <i data-lucide="shopping-cart"></i>
                                กดซื้อและส่งออเดอร์
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/admin-sidebar.js"></script>
    <script>
        "use strict";

        const API_BASE_URL = window.location.origin;
        let shops = [];
        let selectedShopId = null;
        let products = [];
        let selectedProduct = null;

        const $ = (id) => document.getElementById(id);

        function getToken() {
            return localStorage.getItem("tiktokShopToken") ||
                localStorage.getItem("tiktokShopJWT") ||
                localStorage.getItem("authToken") ||
                localStorage.getItem("token") || "";
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function money(value) {
            return "$" + Number(value || 0).toFixed(2);
        }

        function toast(message, error = false) {
            const el = $("toast");
            el.textContent = message;
            el.className = "toast show" + (error ? " error" : "");
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => el.className = "toast", 2800);
        }

        async function api(path, options = {}) {
            const token = getToken();
            const response = await fetch(API_BASE_URL + path, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                    Authorization: `Bearer ${token}`
                }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || "เกิดข้อผิดพลาด");
            return data;
        }

        function renderShops() {
            const keyword = $("shopSearch").value.trim().toLowerCase();
            const filtered = shops.filter(shop => {
                const text = `${shop.shopName || ""} ${shop.username || ""}`.toLowerCase();
                return text.includes(keyword);
            });

            $("shopCount").textContent = `${filtered.length} ร้าน`;

            if (!filtered.length) {
                $("shopList").innerHTML = `<div class="empty"><i data-lucide="store"></i><strong>ไม่พบร้านค้า</strong><span>ลองเปลี่ยนคำค้นหา</span></div>`;
                lucide.createIcons();
                return;
            }

            $("shopList").innerHTML = filtered.map(shop => {
                const name = shop.shopName || shop.username || "Shop";
                const image = shop.profileImage || "";
                return `
                    <button type="button" class="shop-card ${String(shop.id) === String(selectedShopId) ? "active" : ""}" data-id="${escapeHTML(shop.id)}">
                        <div class="avatar">
                            ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(name)}" onerror="this.remove();">` : escapeHTML(name.charAt(0).toUpperCase())}
                        </div>
                        <div class="shop-info">
                            <strong>${escapeHTML(name)}</strong>
                            <span>@${escapeHTML(shop.username || "-")}</span>
                        </div>
                        <div class="shop-count">${Number(shop.productCount || 0)} สินค้า</div>
                    </button>
                `;
            }).join("");

            $("shopList").querySelectorAll(".shop-card").forEach(button => {
                button.addEventListener("click", () => selectShop(button.dataset.id));
            });
            lucide.createIcons();
        }

        async function selectShop(shopId) {
            selectedShopId = shopId;
            selectedProduct = null;
            products = [];
            $("orderPanel").style.display = "none";
            renderShops();
            $("products").innerHTML = `<div class="empty"><i data-lucide="loader-circle"></i><strong>กำลังโหลดสินค้า...</strong><span>รอสักครู่</span></div>`;
            lucide.createIcons();

            try {
                const data = await api(`/api/admin/shop-orders/shops/${encodeURIComponent(shopId)}/products`);
                products = data.products || [];
                const shop = data.shop;
                const name = shop.shopName || shop.username || "Shop";
                const image = shop.profileImage || "";
                $("selectedShop").style.display = "flex";
                $("selectedShop").innerHTML = `
                    <div class="avatar">${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(name)}">` : escapeHTML(name.charAt(0).toUpperCase())}</div>
                    <div><strong>${escapeHTML(name)}</strong><span>@${escapeHTML(shop.username || "-")} · ${products.length} สินค้า</span></div>
                `;
                renderProducts();
            } catch (error) {
                toast(error.message, true);
                $("products").innerHTML = `<div class="empty"><i data-lucide="circle-alert"></i><strong>โหลดสินค้าไม่สำเร็จ</strong><span>${escapeHTML(error.message)}</span></div>`;
                lucide.createIcons();
            }
        }

        function renderProducts() {
            if (!products.length) {
                $("products").innerHTML = `<div class="empty"><i data-lucide="package-search"></i><strong>ร้านนี้ยังไม่มีสินค้า</strong><span>ไม่พบสินค้าที่เปิดขายอยู่</span></div>`;
                lucide.createIcons();
                return;
            }

            $("products").innerHTML = products.map(product => {
                const id = product._id || product.id;
                const image = product.image || "";
                const stock = Number(product.stock || 0);
                const price = Number(product.salePrice || 0);
                return `
                    <article class="product-card ${String(selectedProduct?._id || selectedProduct?.id) === String(id) ? "selected" : ""}" data-id="${escapeHTML(id)}">
                        <div class="product-image">
                            ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(product.name || "Product")}" onerror="this.style.display='none';">` : `<i data-lucide="package"></i>`}
                        </div>
                        <div class="product-body">
                            <div class="product-name">${escapeHTML(product.name || "Product")}</div>
                            <div class="product-meta"><span class="price">${money(price)}</span><span class="stock">เหลือ ${stock} ชิ้น</span></div>
                        </div>
                    </article>
                `;
            }).join("");

            $("products").querySelectorAll(".product-card").forEach(card => {
                card.addEventListener("click", () => chooseProduct(card.dataset.id));
            });
            lucide.createIcons();
        }

        function chooseProduct(productId) {
            selectedProduct = products.find(product => String(product._id || product.id) === String(productId)) || null;
            if (!selectedProduct) return;
            $("quantity").value = 1;
            $("shippingAddress").focus();
            $("orderPanel").style.display = "block";
            renderProducts();
            renderSelectedProduct();
        }

        function renderSelectedProduct() {
            if (!selectedProduct) return;
            const image = selectedProduct.image || "";
            $("selectedProduct").innerHTML = `
                <div class="selected-product">
                    ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(selectedProduct.name || "Product")}">` : `<div style="width:64px;height:64px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center"><i data-lucide="package"></i></div>`}
                    <div><strong>${escapeHTML(selectedProduct.name || "Product")}</strong><span>ราคาต่อชิ้น ${money(selectedProduct.salePrice)} · สต็อก ${Number(selectedProduct.stock || 0)} ชิ้น</span></div>
                </div>
            `;
            updateTotal();
            lucide.createIcons();
        }

        function updateTotal() {
            if (!selectedProduct) return;
            let quantity = Number($("quantity").value || 1);
            const stock = Number(selectedProduct.stock || 0);
            if (!Number.isInteger(quantity) || quantity < 1) quantity = 1;
            if (stock > 0) quantity = Math.min(quantity, stock);
            $("quantity").value = quantity;
            $("total").textContent = money(quantity * Number(selectedProduct.salePrice || 0));
            $("buyButton").disabled = !selectedProduct || stock < 1;
        }

        async function createOrder() {
            if (!selectedShopId || !selectedProduct) return;
            const buyerName = $("buyerName").value.trim();
            const quantity = Number($("quantity").value);
            const shippingAddress = $("shippingAddress").value.trim();
            const shippingPhone = $("shippingPhone").value.trim();
            const buyerNote = $("buyerNote").value.trim();

            if (!buyerName) {

            return toast(
           "กรุณากรอกชื่อผู้ซื้อ",
                true
                  );

                  }
            if (!Number.isInteger(quantity) || quantity < 1) return toast("จำนวนสินค้าไม่ถูกต้อง", true);
            if (quantity > Number(selectedProduct.stock || 0)) return toast("จำนวนเกินสต็อก", true);
            if (!shippingAddress) return toast("กรุณากรอกข้อมูลจัดส่ง", true);

            const button = $("buyButton");
            button.disabled = true;
            button.innerHTML = `<i data-lucide="loader-circle"></i> กำลังสร้างออเดอร์...`;
            lucide.createIcons();

            try {
                const data = await api("/api/admin/shop-orders", {
                    method: "POST",
                    body: JSON.stringify({
                        sellerId: selectedShopId,
                        productId: selectedProduct._id || selectedProduct.id,
                        quantity,
                        buyerName,
                        shippingAddress,
                        shippingPhone,
                        buyerNote
                    })
                });

                toast(`สร้างออเดอร์ #${data.order?.orderId || "สำเร็จ"} แล้ว`);
                window.location.href = `admin-orders.html?orderId=${encodeURIComponent(data.order?.orderId || "")}`;
            } catch (error) {
                toast(error.message, true);
                button.disabled = false;
            } finally {
                button.innerHTML = `<i data-lucide="shopping-cart"></i> กดซื้อและส่งออเดอร์`;
                lucide.createIcons();
                updateTotal();
            }
        }

        $("shopSearch").addEventListener("input", renderShops);
        $("quantity").addEventListener("input", updateTotal);
        $("minusButton").addEventListener("click", () => {
            $("quantity").value = Math.max(1, Number($("quantity").value || 1) - 1);
            updateTotal();
        });
        $("plusButton").addEventListener("click", () => {
            const stock = Number(selectedProduct?.stock || 1);
            $("quantity").value = Math.min(stock, Number($("quantity").value || 1) + 1);
            updateTotal();
        });
        $("buyButton").addEventListener("click", createOrder);

        async function init() {
            if (!getToken()) {
                window.location.href = "auth.html?mode=login";
                return;
            }
            try {
                const data = await api("/api/admin/shop-orders/shops");
                shops = data.shops || [];
                renderShops();
            } catch (error) {
                toast(error.message, true);
                $("shopList").innerHTML = `<div class="empty"><i data-lucide="circle-alert"></i><strong>โหลดร้านค้าไม่สำเร็จ</strong><span>${escapeHTML(error.message)}</span></div>`;
                lucide.createIcons();
            }
        }

        init();
    </script>
</body>
</html>

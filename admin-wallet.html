<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Wallet - TikTok Shop</title>

    <!-- App Icon -->
<link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>

<!-- iPhone / iPad Home Screen Icon -->
<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="images/apple-touch-icon.png"
>

<!-- PWA Manifest -->
<link
    rel="manifest"
    href="manifest.json"
>

<!-- Mobile Web App -->
<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
>

<meta
    name="apple-mobile-web-app-title"
    content="TikTok Shop"
>

<meta
    name="theme-color"
    content="#000000"
>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #f6f6f7;
            font-family: Inter, sans-serif;
            color: #111;
        }


        .admin-wallet-main {
            min-height: 100vh;
            padding: 30px;
        }


        .admin-wallet-container {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .admin-wallet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }


        .admin-wallet-header h1 {
            margin: 0;
            font-size: 29px;
            font-weight: 800;
        }


        .admin-wallet-header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 13px;
        }


        .admin-refresh-btn {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 11px;
            padding: 11px 15px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .admin-wallet-stats {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }


        .admin-stat {
            background: #fff;
            border: 1px solid #e7e7ea;
            border-radius: 16px;
            padding: 19px;
        }


        .admin-stat-icon {
            width: 39px;
            height: 39px;
            border-radius: 10px;
            background: #f2f2f3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 13px;
        }


        .admin-stat span {
            display: block;
            color: #888;
            font-size: 12px;
        }


        .admin-stat strong {
            display: block;
            margin-top: 5px;
            font-size: 22px;
            font-weight: 800;
        }


        /* =====================================================
           FILTER
        ===================================================== */

        .admin-wallet-toolbar {
            background: #fff;
            border: 1px solid #e7e7ea;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
        }


        .admin-filter {
            border: 0;
            background: transparent;
            padding: 10px 15px;
            border-radius: 9px;
            font-family: inherit;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            white-space: nowrap;
        }


        .admin-filter.active {
            background: #111;
            color: #fff;
        }


        /* =====================================================
           TRANSACTIONS
        ===================================================== */

        .admin-wallet-card {
            background: #fff;
            border: 1px solid #e7e7ea;
            border-radius: 17px;
            overflow: hidden;
        }


        .admin-wallet-card-header {
            padding: 19px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .admin-wallet-card-header h2 {
            margin: 0;
            font-size: 18px;
        }


        .admin-transaction-list {
            display: grid;
        }


        .admin-transaction {
            padding: 17px 20px;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns:
                minmax(200px, 1.5fr)
                minmax(130px, .8fr)
                minmax(130px, .8fr)
                minmax(150px, .9fr)
                auto;
            gap: 15px;
            align-items: center;
        }


        .admin-transaction:last-child {
            border-bottom: 0;
        }


        .admin-user {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }


        .admin-user-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #f1f1f2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }


        .admin-user-info {
            min-width: 0;
        }


        .admin-user-info strong {
            display: block;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .admin-user-info span {
            display: block;
            color: #888;
            font-size: 11px;
            margin-top: 3px;
        }


        .admin-tx-label {
            color: #999;
            font-size: 10px;
            margin-bottom: 4px;
        }


        .admin-tx-value {
            font-size: 13px;
            font-weight: 700;
        }


        .admin-tx-amount {
            font-size: 15px;
            font-weight: 800;
        }


        .admin-tx-amount.deposit {
            color: #008b42;
        }


        .admin-tx-amount.withdrawal {
            color: #d81b46;
        }


        .admin-status {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 999px;
            background: #f1f1f2;
            font-size: 10px;
            font-weight: 700;
        }


        .admin-status.pending,
        .admin-status.under_review {
            background: #fff3dc;
            color: #9b5b00;
        }


        .admin-status.completed {
            background: #e8fff0;
            color: #008b42;
        }


        .admin-status.rejected {
            background: #fff0f3;
            color: #d81b46;
        }


        .admin-action-btn {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 9px;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }


        .admin-action-btn:hover {
            background: #f6f6f6;
        }


        .admin-empty {
            padding: 65px 20px;
            text-align: center;
            color: #888;
        }


        .admin-empty-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #f1f1f2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }


        .admin-empty strong {
            display: block;
            color: #555;
            font-size: 14px;
        }


        .admin-empty span {
            display: block;
            font-size: 12px;
            margin-top: 5px;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .admin-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }


        .admin-modal-overlay.show {
            display: flex;
        }


        .admin-modal {
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 20px;
            padding: 24px;
        }


        .admin-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }


        .admin-modal-header h3 {
            margin: 0;
            font-size: 19px;
        }


        .admin-close {
            width: 35px;
            height: 35px;
            border: 0;
            border-radius: 9px;
            background: #f1f1f2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .admin-detail-box {
            background: #f7f7f8;
            border-radius: 13px;
            padding: 15px;
            margin-bottom: 15px;
        }


        .admin-detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
        }


        .admin-detail-row span {
            color: #888;
            font-size: 12px;
        }


        .admin-detail-row strong {
            text-align: right;
            font-size: 13px;
            word-break: break-word;
        }


        .admin-form-group {
            margin-bottom: 16px;
        }


        .admin-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }


        .admin-input,
        .admin-select,
        .admin-textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }


        .admin-input:focus,
        .admin-select:focus,
        .admin-textarea:focus {
            border-color: #111;
        }


        .admin-textarea {
            min-height: 85px;
            resize: vertical;
        }


        .admin-modal-actions {
            display: flex;
            gap: 9px;
            margin-top: 20px;
        }


        .admin-modal-actions button {
            flex: 1;
            height: 44px;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }


        .admin-btn-cancel {
            background: #eee;
        }


        .admin-btn-primary {
            background: #111;
            color: #fff;
        }


        .admin-btn-success {
            background: #008b42;
            color: #fff;
        }


        .admin-btn-danger {
            background: #d81b46;
            color: #fff;
        }


        .admin-slip {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-top: 12px;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .admin-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 11000;
            background: #111;
            color: #fff;
            padding: 13px 16px;
            border-radius: 11px;
            display: none;
            min-width: 250px;
            font-size: 13px;
        }


        .admin-toast.show {
            display: block;
        }


        .admin-toast.success {
            background: #008b42;
        }


        .admin-toast.error {
            background: #d81b46;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 900px) {

            .admin-wallet-main {
                padding: 75px 16px 20px;
            }


            .admin-wallet-stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }


            .admin-transaction {
                display: block;
                padding: 18px;
            }


            .admin-user {
                margin-bottom: 15px;
            }


            .admin-transaction > div {
                margin-bottom: 11px;
            }


            .admin-action-btn {
                width: 100%;
            }

        }


        @media (max-width: 500px) {

            .admin-wallet-stats {
                grid-template-columns: 1fr;
            }


            .admin-wallet-header {
                align-items: flex-start;
            }


            .admin-wallet-header h1 {
                font-size: 24px;
            }


            .admin-modal {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SHARED SIDEBAR
    ===================================================== -->

    <div id="sidebar-container"></div>


    <!-- =====================================================
         MOBILE MENU
    ===================================================== -->

    <button
        id="menuButton"
        type="button"
        aria-label="Open menu"
        style="
            display:none;
            position:fixed;
            top:14px;
            left:14px;
            width:44px;
            height:44px;
            border:1px solid #ddd;
            border-radius:11px;
            background:#fff;
            z-index:5000;
            align-items:center;
            justify-content:center;
        "
    >

        <i data-lucide="menu"></i>

    </button>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="main-content">

        <div class="admin-wallet-main">

            <div class="admin-wallet-container">


                <!-- =================================================
                     HEADER
                ================================================= -->

                <div class="admin-wallet-header">

                    <div>

                        <h1>
                            Wallet Management
                        </h1>

                        <p>
                            จัดการคำขอฝากเงินและถอนเงินของผู้ใช้
                        </p>

                    </div>


                    <button
                        class="admin-refresh-btn"
                        id="refreshButton"
                        type="button"
                    >

                        <i
                            data-lucide="refresh-cw"
                            width="16"
                        ></i>

                        รีเฟรช

                    </button>

                </div>


                <!-- =================================================
                     STATS
                ================================================= -->

                <div class="admin-wallet-stats">

                    <div class="admin-stat">

                        <div class="admin-stat-icon">

                            <i
                                data-lucide="clock-3"
                                width="20"
                            ></i>

                        </div>

                        <span>
                            รายการรอตรวจสอบ
                        </span>

                        <strong id="pendingCount">
                            0
                        </strong>

                    </div>


                    <div class="admin-stat">

                        <div class="admin-stat-icon">

                            <i
                                data-lucide="arrow-down-left"
                                width="20"
                            ></i>

                        </div>

                        <span>
                            ฝากรอตรวจ
                        </span>

                        <strong id="depositCount">
                            0
                        </strong>

                    </div>


                    <div class="admin-stat">

                        <div class="admin-stat-icon">

                            <i
                                data-lucide="arrow-up-right"
                                width="20"
                            ></i>

                        </div>

                        <span>
                            ถอนรอตรวจ
                        </span>

                        <strong id="withdrawCount">
                            0
                        </strong>

                    </div>


                    <div class="admin-stat">

                        <div class="admin-stat-icon">

                            <i
                                data-lucide="circle-dollar-sign"
                                width="20"
                            ></i>

                        </div>

                        <span>
                            ยอดคำขอรอดำเนินการ
                        </span>

                        <strong id="pendingAmount">
                            $0.00
                        </strong>

                    </div>

                </div>


                <!-- =================================================
                     FILTER
                ================================================= -->

                <div class="admin-wallet-toolbar">

                    <button
                        class="admin-filter active"
                        data-filter="all"
                        type="button"
                    >
                        ทั้งหมด
                    </button>


                    <button
                        class="admin-filter"
                        data-filter="deposit"
                        type="button"
                    >
                        ฝากเงิน
                    </button>


                    <button
                        class="admin-filter"
                        data-filter="withdrawal"
                        type="button"
                    >
                        ถอนเงิน
                    </button>


                    <button
                        class="admin-filter"
                        data-filter="pending"
                        type="button"
                    >
                        รอดำเนินการ
                    </button>


                    <button
                        class="admin-filter"
                        data-filter="under_review"
                        type="button"
                    >
                        รอตรวจสลิป
                    </button>


                    <button
                        class="admin-filter"
                        data-filter="completed"
                        type="button"
                    >
                        สำเร็จ
                    </button>

                </div>


                <!-- =================================================
                     TRANSACTION LIST
                ================================================= -->

                <div class="admin-wallet-card">

                    <div class="admin-wallet-card-header">

                        <h2>
                            Wallet Transactions
                        </h2>

                        <span
                            id="transactionCount"
                            style="
                                color:#888;
                                font-size:12px;
                            "
                        >
                            0 รายการ
                        </span>

                    </div>


                    <div
                        class="admin-transaction-list"
                        id="transactionList"
                    ></div>

                </div>


            </div>

        </div>

    </main>


    <!-- =====================================================
         TRANSACTION MODAL
    ===================================================== -->

    <div
        class="admin-modal-overlay"
        id="transactionModal"
    >

        <div class="admin-modal">

            <div class="admin-modal-header">

                <h3>
                    รายละเอียดธุรกรรม
                </h3>


                <button
                    class="admin-close"
                    id="closeTransactionModal"
                    type="button"
                >

                    <i
                        data-lucide="x"
                        width="17"
                    ></i>

                </button>

            </div>


            <div id="transactionDetail"></div>

        </div>

    </div>


    <!-- =====================================================
         ASSIGN PAYMENT ACCOUNT MODAL
    ===================================================== -->

    <div
        class="admin-modal-overlay"
        id="assignAccountModal"
    >

        <div class="admin-modal">

            <div class="admin-modal-header">

                <h3>
                    ส่งบัญชีสำหรับฝากเงิน
                </h3>


                <button
                    class="admin-close"
                    id="closeAssignModal"
                    type="button"
                >

                    <i
                        data-lucide="x"
                        width="17"
                    ></i>

                </button>

            </div>


            <div
                class="admin-detail-box"
                id="assignUserInfo"
            ></div>


            <div class="admin-form-group">

                <label>
                    ช่องทาง
                </label>


                <select
                    class="admin-select"
                    id="assignMethod"
                >

                    <option value="bank">
                        Bank Account
                    </option>

                    <option value="crypto">
                        Crypto
                    </option>

                </select>

            </div>


            <div id="assignBankFields">

                <div class="admin-form-group">

                    <label>
                        ธนาคาร
                    </label>

                    <input
                        class="admin-input"
                        id="assignBankName"
                        placeholder="ชื่อธนาคาร"
                    >

                </div>


                <div class="admin-form-group">

                    <label>
                        ชื่อบัญชี
                    </label>

                    <input
                        class="admin-input"
                        id="assignAccountName"
                        placeholder="ชื่อเจ้าของบัญชี"
                    >

                </div>


                <div class="admin-form-group">

                    <label>
                        เลขบัญชี
                    </label>

                    <input
                        class="admin-input"
                        id="assignAccountNumber"
                        placeholder="เลขบัญชี"
                    >

                </div>


                <div class="admin-form-group">

                    <label>
                        สาขา
                    </label>

                    <input
                        class="admin-input"
                        id="assignBranch"
                        placeholder="สาขา"
                    >

                </div>

            </div>


            <div
                id="assignCryptoFields"
                style="display:none;"
            >

                <div class="admin-form-group">

                    <label>
                        Network
                    </label>

                    <select
                        class="admin-select"
                        id="assignNetwork"
                    >

                        <option value="">
                            เลือก Network
                        </option>

                        <option value="USDT-TRC20">
                            USDT - TRC20
                        </option>

                        <option value="USDT-ERC20">
                            USDT - ERC20
                        </option>

                        <option value="USDT-BEP20">
                            USDT - BEP20
                        </option>

                        <option value="BTC">
                            Bitcoin
                        </option>

                        <option value="ETH">
                            Ethereum
                        </option>

                    </select>

                </div>


                <div class="admin-form-group">

                    <label>
                        Wallet Address
                    </label>

                    <input
                        class="admin-input"
                        id="assignWalletAddress"
                        placeholder="Wallet Address"
                    >

                </div>

            </div>


            <div class="admin-form-group">

                <label>
                    หมายเหตุ
                </label>

                <textarea
                    class="admin-textarea"
                    id="assignNote"
                    placeholder="ข้อความถึงผู้ใช้ (ถ้ามี)"
                ></textarea>

            </div>


            <div class="admin-modal-actions">

                <button
                    class="admin-btn-cancel"
                    id="cancelAssignButton"
                    type="button"
                >
                    ยกเลิก
                </button>


                <button
                    class="admin-btn-primary"
                    id="saveAssignButton"
                    type="button"
                >
                    ส่งข้อมูลบัญชี
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         REJECT MODAL
    ===================================================== -->

    <div
        class="admin-modal-overlay"
        id="rejectModal"
    >

        <div class="admin-modal">

            <div class="admin-modal-header">

                <h3>
                    ปฏิเสธธุรกรรม
                </h3>


                <button
                    class="admin-close"
                    id="closeRejectModal"
                    type="button"
                >

                    <i
                        data-lucide="x"
                        width="17"
                    ></i>

                </button>

            </div>


            <div class="admin-form-group">

                <label>
                    เหตุผล
                </label>

                <textarea
                    class="admin-textarea"
                    id="rejectNote"
                    placeholder="กรุณาระบุเหตุผล"
                ></textarea>

            </div>


            <div class="admin-modal-actions">

                <button
                    class="admin-btn-cancel"
                    id="cancelRejectButton"
                    type="button"
                >
                    ยกเลิก
                </button>


                <button
                    class="admin-btn-danger"
                    id="confirmRejectButton"
                    type="button"
                >
                    ยืนยันปฏิเสธ
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         TOAST
    ===================================================== -->

    <div
        class="admin-toast"
        id="adminToast"
    ></div>


    <script src="js/admin-sidebar.js"></script>


    <script>

        // =====================================================
        // CONFIG
        // =====================================================

        const API_BASE_URL =
            "/api";


        const ADMIN_WALLET_API =
            `${API_BASE_URL}/admin/wallet`;


        // =====================================================
        // STATE
        // =====================================================

        let transactions = [];

        let currentFilter =
            "all";

        let selectedTransaction =
            null;


        // =====================================================
        // HELPERS
        // =====================================================

        function $(id) {

            return document.getElementById(id);

        }


        function getToken() {

            return (
                localStorage.getItem(
                    "tiktokShopToken"
                ) ||
                localStorage.getItem(
                    "token"
                ) ||
                ""
            );

        }


        function escapeHtml(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function money(value) {

            return new Intl.NumberFormat(
                "en-US",
                {
                    style: "currency",
                    currency: "USD",
                    minimumFractionDigits: 2
                }
            ).format(
                Number(value || 0)
            );

        }


        function formatDate(value) {

            if (!value) {
                return "-";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "-";

            }


            return date.toLocaleString(
                "th-TH",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        function statusText(status) {

            const map = {

                pending:
                    "รอดำเนินการ",

                account_assigned:
                    "ส่งบัญชีแล้ว",

                awaiting_slip:
                    "รอสลิป",

                under_review:
                    "รอตรวจสอบสลิป",

                completed:
                    "สำเร็จ",

                rejected:
                    "ปฏิเสธ",

                cancelled:
                    "ยกเลิก"

            };


            return (
                map[status] ||
                status ||
                "-"
            );

        }


        function showToast(
            message,
            type = ""
        ) {

            const toast =
                $("adminToast");


            toast.textContent =
                message;


            toast.className =
                `admin-toast show ${type}`;


            clearTimeout(
                window.adminToastTimer
            );


            window.adminToastTimer =
                setTimeout(
                    () => {

                        toast.className =
                            "admin-toast";

                    },
                    3500
                );

        }


        // =====================================================
        // API
        // =====================================================

        async function apiFetch(
            url,
            options = {}
        ) {

            const token =
                getToken();


            if (!token) {

                window.location.href =
                    "auth.html?mode=login";

                throw new Error(
                    "Authentication required."
                );

            }


            const headers = {

                ...(options.headers || {})

            };


            if (options.body) {

                headers["Content-Type"] =
                    "application/json";

            }


            headers.Authorization =
                `Bearer ${token}`;


            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        headers
                    }
                );


            let data = null;


            try {

                data =
                    await response.json();

            }

            catch {

                data = null;

            }


            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    "tiktokShopToken"
                );

                localStorage.removeItem(
                    "token"
                );

                window.location.href =
                    "auth.html?mode=login";

                throw new Error(
                    "Authentication required."
                );

            }


            if (
                response.status ===
                403
            ) {

                document.body.innerHTML = `

                    <div
                        style="
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:20px;
                            background:#f6f6f7;
                            font-family:Inter,sans-serif;
                        "
                    >

                        <div
                            style="
                                width:100%;
                                max-width:420px;
                                background:#fff;
                                border:1px solid #e5e5e8;
                                border-radius:20px;
                                padding:35px 25px;
                                text-align:center;
                            "
                        >

                            <div
                                style="
                                    width:60px;
                                    height:60px;
                                    border-radius:50%;
                                    background:#fff0f3;
                                    color:#d81b46;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    margin:0 auto 15px;
                                "
                            >

                                <i
                                    data-lucide="shield-x"
                                    width="28"
                                ></i>

                            </div>


                            <h2
                                style="
                                    margin:0;
                                    font-size:22px;
                                "
                            >
                                ไม่มีสิทธิ์เข้าถึง
                            </h2>


                            <p
                                style="
                                    color:#777;
                                    font-size:13px;
                                    line-height:1.6;
                                    margin:9px 0 20px;
                                "
                            >
                                บัญชีของคุณไม่ได้รับอนุญาต
                                ให้เข้าถึงหน้า Admin
                            </p>


                            <button
                                onclick="location.href='index.html'"
                                style="
                                    width:100%;
                                    height:44px;
                                    border:0;
                                    border-radius:10px;
                                    background:#111;
                                    color:#fff;
                                    font-family:inherit;
                                    font-weight:700;
                                    cursor:pointer;
                                "
                            >
                                กลับหน้าหลัก
                            </button>

                        </div>

                    </div>

                `;


                if (
                    window.lucide
                ) {

                    lucide.createIcons();

                }


                throw new Error(
                    "Admin access denied."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data?.message ||
                    "Request failed."
                );

            }


            return data;

        }


        // =====================================================
        // LOAD TRANSACTIONS
        // =====================================================

        async function loadTransactions() {

            try {

                const data =
                    await apiFetch(
                        `${ADMIN_WALLET_API}/transactions`
                    );


                transactions =
                    data.transactions || [];


                renderStats();

                renderTransactions();

            }

            catch (error) {

                console.error(
                    error
                );


                if (
                    error.message !==
                    "Admin access denied."
                ) {

                    showToast(
                        error.message,
                        "error"
                    );

                }

            }

        }


        // =====================================================
        // STATS
        // =====================================================

        function renderStats() {

            const pending =
                transactions.filter(
                    tx =>
                        [
                            "pending",
                            "account_assigned",
                            "awaiting_slip",
                            "under_review"
                        ].includes(
                            tx.status
                        )
                );


            const deposits =
                transactions.filter(
                    tx =>
                        tx.type ===
                        "deposit" &&
                        [
                            "pending",
                            "account_assigned",
                            "awaiting_slip",
                            "under_review"
                        ].includes(
                            tx.status
                        )
                );


            const withdrawals =
                transactions.filter(
                    tx =>
                        tx.type ===
                        "withdrawal" &&
                        tx.status ===
                        "pending"
                );


            const pendingAmount =
                pending.reduce(
                    (
                        total,
                        tx
                    ) =>
                        total +
                        Number(
                            tx.amount || 0
                        ),
                    0
                );


            $("pendingCount")
                .textContent =
                pending.length;


            $("depositCount")
                .textContent =
                deposits.length;


            $("withdrawCount")
                .textContent =
                withdrawals.length;


            $("pendingAmount")
                .textContent =
                money(
                    pendingAmount
                );

        }


        // =====================================================
        // FILTER
        // =====================================================

        function filteredTransactions() {

            if (
                currentFilter ===
                "all"
            ) {

                return transactions;

            }


            if (
                [
                    "deposit",
                    "withdrawal"
                ].includes(
                    currentFilter
                )
            ) {

                return transactions.filter(
                    tx =>
                        tx.type ===
                        currentFilter
                );

            }


            return transactions.filter(
                tx =>
                    tx.status ===
                    currentFilter
            );

        }


        // =====================================================
        // RENDER
        // =====================================================

        function renderTransactions() {

            const list =
                $("transactionList");


            const items =
                filteredTransactions();


            $("transactionCount")
                .textContent =
                `${items.length} รายการ`;


            if (!items.length) {

                list.innerHTML = `

                    <div class="admin-empty">

                        <div class="admin-empty-icon">

                            <i
                                data-lucide="inbox"
                                width="25"
                            ></i>

                        </div>

                        <strong>
                            ไม่มีรายการ
                        </strong>

                        <span>
                            ยังไม่มีธุรกรรมในหมวดนี้
                        </span>

                    </div>

                `;


                refreshIcons();

                return;

            }


            list.innerHTML =
                items
                    .map(
                        transaction =>
                            transactionHTML(
                                transaction
                            )
                    )
                    .join("");


            refreshIcons();


            list
                .querySelectorAll(
                    "[data-view]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                openTransaction(
                                    button.dataset.view
                                );

                            }
                        );

                    }
                );


            list
                .querySelectorAll(
                    "[data-assign]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                openAssignModal(
                                    button.dataset.assign
                                );

                            }
                        );

                    }
                );


            list
                .querySelectorAll(
                    "[data-approve]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                approveTransaction(
                                    button.dataset.approve
                                );

                            }
                        );

                    }
                );


            list
                .querySelectorAll(
                    "[data-reject]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                openRejectModal(
                                    button.dataset.reject
                                );

                            }
                        );

                    }
                );

        }

        // =====================================================
        // OPEN TRANSACTION
        // =====================================================

        async function openTransaction(
            id
        ) {

            try {

                const data =
                    await apiFetch(
                        `${ADMIN_WALLET_API}/transactions/${id}`
                    );


                selectedTransaction =
                    data.transaction;


                renderTransactionDetail(
                    selectedTransaction
                );


                $("transactionModal")
                    .classList.add(
                        "show"
                    );

            }

            catch (error) {

                showToast(
                    error.message,
                    "error"
                );

            }

        }

        // =====================================================
        // ASSIGN ACCOUNT
        // =====================================================

        function openAssignModal(
            id
        ) {

            const tx =
                transactions.find(
                    item =>
                        String(
                            item._id
                        ) ===
                        String(id)
                );


            if (!tx) {

                return;

            }


            selectedTransaction =
                tx;


            const user =
                tx.userId || {};


            $("assignUserInfo")
                .innerHTML = `

                    ${detailRow(
                        "ร้านค้า",
                        user.shopName ||
                        user.username ||
                        "-"
                    )}

                    ${detailRow(
                        "Username",
                        user.username ||
                        "-"
                    )}

                    ${detailRow(
                        "จำนวนเงิน",
                        money(tx.amount)
                    )}

                `;


            $("assignMethod")
                .value =
                tx.method === "crypto"
                    ? "crypto"
                    : "bank";


            toggleAssignFields();


            $("assignAccountModal")
                .classList.add(
                    "show"
                );

        }


        function toggleAssignFields() {

            const method =
                $("assignMethod")
                    .value;


            $("assignBankFields")
                .style.display =
                method === "bank"
                    ? "block"
                    : "none";


            $("assignCryptoFields")
                .style.display =
                method === "crypto"
                    ? "block"
                    : "none";

        }


        async function saveAssignedAccount() {

            if (!selectedTransaction) {

                return;

            }


            const method =
                $("assignMethod")
                    .value;


            const payload = {

                method,

                note:
                    $("assignNote")
                        .value
                        .trim()

            };


            if (
                method ===
                "bank"
            ) {

                payload.bankName =
                    $("assignBankName")
                        .value
                        .trim();


                payload.accountName =
                    $("assignAccountName")
                        .value
                        .trim();


                payload.accountNumber =
                    $("assignAccountNumber")
                        .value
                        .trim();


                payload.branch =
                    $("assignBranch")
                        .value
                        .trim();


                if (
                    !payload.bankName ||
                    !payload.accountName ||
                    !payload.accountNumber
                ) {

                    showToast(
                        "กรุณากรอกข้อมูลบัญชีให้ครบ",
                        "error"
                    );

                    return;

                }

            }


            if (
                method ===
                "crypto"
            ) {

                payload.network =
                    $("assignNetwork")
                        .value
                        .trim();


                payload.walletAddress =
                    $("assignWalletAddress")
                        .value
                        .trim();


                if (
                    !payload.network ||
                    !payload.walletAddress
                ) {

                    showToast(
                        "กรุณากรอก Network และ Wallet Address",
                        "error"
                    );

                    return;

                }

            }


            try {

                $("saveAssignButton")
                    .disabled =
                    true;


                await apiFetch(

                    `${ADMIN_WALLET_API}/deposits/` +
                    `${selectedTransaction._id}/account`,

                    {

                        method: "POST",

                        body:
                            JSON.stringify(
                                payload
                            )

                    }

                );


                closeAssignModal();


                showToast(
                    "ส่งข้อมูลบัญชีให้ผู้ใช้แล้ว",
                    "success"
                );


                await loadTransactions();

            }

            catch (error) {

                showToast(
                    error.message,
                    "error"
                );

            }

            finally {

                $("saveAssignButton")
                    .disabled =
                    false;

            }

        }


        // =====================================================
        // APPROVE
        // =====================================================

        async function approveTransaction(
            id
        ) {

            const tx =
                transactions.find(
                    item =>
                        String(
                            item._id
                        ) ===
                        String(id)
                );


            if (!tx) {

                return;

            }


            const message =
                tx.type === "deposit"

                    ? "ยืนยันอนุมัติฝากเงิน? เงินจะเข้ากระเป๋าผู้ใช้ทันที"

                    : "ยืนยันอนุมัติถอนเงิน? เงินจะถูกหักจากกระเป๋าผู้ใช้ทันที";


            if (
                !confirm(
                    message
                )
            ) {

                return;

            }


            try {

                const endpoint =
                    tx.type === "deposit"

                        ? `${ADMIN_WALLET_API}/deposits/${id}/approve`

                        : `${ADMIN_WALLET_API}/withdrawals/${id}/approve`;


                await apiFetch(
                    endpoint,
                    {

                        method: "POST",

                        body:
                            JSON.stringify({})

                    }
                );


                showToast(
                    tx.type === "deposit"
                        ? "อนุมัติฝากเงินแล้ว เงินเข้ากระเป๋าผู้ใช้"
                        : "อนุมัติถอนเงินแล้ว เงินถูกหักจากกระเป๋าผู้ใช้",
                    "success"
                );


                await loadTransactions();

            }

            catch (error) {

                showToast(
                    error.message,
                    "error"
                );

            }

        }


        // =====================================================
        // REJECT
        // =====================================================

        function openRejectModal(
            id
        ) {

            const tx =
                transactions.find(
                    item =>
                        String(
                            item._id
                        ) ===
                        String(id)
                );


            if (!tx) {

                return;

            }


            selectedTransaction =
                tx;


            $("rejectNote")
                .value =
                "";


            $("rejectModal")
                .classList.add(
                    "show"
                );

        }


        async function confirmReject() {

            if (!selectedTransaction) {

                return;

            }


            const note =
                $("rejectNote")
                    .value
                    .trim();


            if (!note) {

                showToast(
                    "กรุณาระบุเหตุผล",
                    "error"
                );

                return;

            }


            try {

                $("confirmRejectButton")
                    .disabled =
                    true;


                const endpoint =
                    selectedTransaction.type ===
                    "deposit"

                        ? `${ADMIN_WALLET_API}/deposits/${selectedTransaction._id}/reject`

                        : `${ADMIN_WALLET_API}/withdrawals/${selectedTransaction._id}/reject`;


                await apiFetch(
                    endpoint,
                    {

                        method: "POST",

                        body:
                            JSON.stringify({

                                note

                            })

                    }
                );


                closeRejectModal();


                showToast(
                    "ปฏิเสธธุรกรรมแล้ว",
                    "success"
                );


                await loadTransactions();

            }

            catch (error) {

                showToast(
                    error.message,
                    "error"
                );

            }

            finally {

                $("confirmRejectButton")
                    .disabled =
                    false;

            }

        }


        // =====================================================
        // CLOSE MODALS
        // =====================================================

        function closeTransactionModal() {

            $("transactionModal")
                .classList.remove(
                    "show"
                );

        }


        function closeAssignModal() {

            $("assignAccountModal")
                .classList.remove(
                    "show"
                );

        }


        function closeRejectModal() {

            $("rejectModal")
                .classList.remove(
                    "show"
                );

        }


        // =====================================================
        // ICONS
        // =====================================================

        function refreshIcons() {

            if (
                window.lucide &&
                typeof lucide.createIcons ===
                "function"
            ) {

                lucide.createIcons();

            }

        }


        // =====================================================
        // EVENTS
        // =====================================================

        document
            .querySelectorAll(
                ".admin-filter"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".admin-filter"
                                )
                                .forEach(
                                    item =>
                                        item.classList.remove(
                                            "active"
                                        )
                                );


                            button.classList.add(
                                "active"
                            );


                            currentFilter =
                                button.dataset.filter;


                            renderTransactions();

                        }
                    );

                }
            );


        $("refreshButton")
            .addEventListener(
                "click",
                async () => {

                    await loadTransactions();

                    showToast(
                        "รีเฟรชข้อมูลแล้ว",
                        "success"
                    );

                }
            );


        $("closeTransactionModal")
            .addEventListener(
                "click",
                closeTransactionModal
            );


        $("closeAssignModal")
            .addEventListener(
                "click",
                closeAssignModal
            );


        $("cancelAssignButton")
            .addEventListener(
                "click",
                closeAssignModal
            );


        $("saveAssignButton")
            .addEventListener(
                "click",
                saveAssignedAccount
            );


        $("assignMethod")
            .addEventListener(
                "change",
                toggleAssignFields
            );


        $("closeRejectModal")
            .addEventListener(
                "click",
                closeRejectModal
            );


        $("cancelRejectButton")
            .addEventListener(
                "click",
                closeRejectModal
            );


        $("confirmRejectButton")
            .addEventListener(
                "click",
                confirmReject
            );


        [
            "transactionModal",
            "assignAccountModal",
            "rejectModal"
        ]
            .forEach(
                id => {

                    $(id)
                        .addEventListener(
                            "click",
                            event => {

                                if (
                                    event.target ===
                                    $(id)
                                ) {

                                    $(id)
                                        .classList.remove(
                                            "show"
                                        );

                                }

                            }
                        );

                }
            );


        // =====================================================
        // INITIALIZE
        // =====================================================

        async function initialize() {

            const token =
                getToken();


            if (!token) {

                window.location.href =
                    "login.html";

                return;

            }


            await loadTransactions();


            if (
                window.TikTokSharedSidebar &&
                window.TikTokSharedSidebar.ready
            ) {

                try {

                    await
                        window.TikTokSharedSidebar.ready;

                }

                catch {

                }

            }


            refreshIcons();

        }


        initialize();

    </script>

</body>

</html>

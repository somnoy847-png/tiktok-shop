<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>เปลี่ยนรหัสผ่าน - TikTok Shop</title>

    <!-- App Icon -->
    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Lucide -->
    <script
        src="https://unpkg.com/lucide@latest"
    ></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8f8f8,
                    #ffffff
                );

            color: #222;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }


        /* ===============================
           HEADER
        ================================ */

        .header {

            height: 72px;

            background: #fff;

            border-bottom:
                1px solid #eeeeee;

            display: flex;

            align-items: center;

            padding:
                0 32px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand img {

            width: 44px;

            height: 44px;

            object-fit: contain;

            border-radius: 10px;

        }


        .brand-text {

            display: flex;

            flex-direction: column;

        }


        .brand-title {

            font-size: 20px;

            font-weight: 800;

            line-height: 1.1;

        }


        .brand-subtitle {

            font-size: 12px;

            color: #999;

            margin-top: 3px;

        }


        /* ===============================
           MAIN
        ================================ */

        .page {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                40px 20px;

        }


        .card {

            width: 100%;

            max-width: 520px;

            background: #fff;

            border-radius: 22px;

            padding:
                38px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.08);

        }


        .icon-box {

            width: 64px;

            height: 64px;

            margin:
                0 auto 20px;

            border-radius: 18px;

            background:
                #fff0f3;

            color: #ff2d55;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .icon-box i {

            width: 30px;

            height: 30px;

        }


        .title {

            text-align: center;

            font-size: 28px;

            font-weight: 800;

            margin: 0;

        }


        .description {

            text-align: center;

            color: #888;

            font-size: 14px;

            line-height: 1.7;

            margin:
                10px auto 30px;

            max-width: 400px;

        }


        /* ===============================
           STEP
        ================================ */

        .step {

            display: none;

        }


        .step.active {

            display: block;

        }


        /* ===============================
           FORM
        ================================ */

        .field {

            margin-bottom: 20px;

        }


        .field label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .input-wrapper {

            height: 52px;

            border:
                1px solid #dcdcdc;

            border-radius: 12px;

            display: flex;

            align-items: center;

            padding:
                0 14px;

            transition:
                border-color .2s,
                box-shadow .2s;

        }


        .input-wrapper:focus-within {

            border-color: #ff2d55;

            box-shadow:
                0 0 0 3px
                rgba(255, 45, 85, 0.08);

        }


        .input-wrapper i {

            width: 20px;

            height: 20px;

            color: #999;

            flex-shrink: 0;

        }


        .input-wrapper input {

            flex: 1;

            min-width: 0;

            border: 0;

            outline: 0;

            background: transparent;

            padding:
                0 10px;

            font-size: 15px;

            color: #222;

        }

        .input-wrapper .password-toggle {
    border: 0;
    background: transparent;
    padding: 4px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #888;
    flex-shrink: 0;
}

.input-wrapper .password-toggle:hover {
    color: #ff2d55;
}

.input-wrapper .password-toggle i {
    width: 20px;
    height: 20px;
}


        /* ===============================
           BUTTON
        ================================ */

        .button {

            width: 100%;

            height: 52px;

            border: 0;

            border-radius: 12px;

            background:
                #ff2d55;

            color: #fff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .15s,
                opacity .15s;

        }


        .button:hover {

            opacity: .92;

        }


        .button:active {

            transform:
                scale(.99);

        }


        .button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .secondary-button {

            margin-top: 12px;

            background: #f5f5f5;

            color: #333;

        }


        /* ===============================
           MESSAGE
        ================================ */

        .message {

            display: none;

            padding:
                12px 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 18px;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fff0f2;

            color: #d91f45;

            border:
                1px solid #ffd0d9;

        }


        .message.success {

            background: #effbf3;

            color: #18864b;

            border:
                1px solid #ccefd9;

        }


        /* ===============================
           ACCOUNT INFO
        ================================ */

        .account-info {

            background: #f7f7f7;

            border-radius: 12px;

            padding:
                14px 16px;

            margin-bottom: 20px;

            font-size: 13px;

        }


        .account-info strong {

            display: block;

            font-size: 15px;

            margin-bottom: 4px;

        }


        .account-info span {

            color: #888;

        }


        /* ===============================
           BACK LINK
        ================================ */

        .back-link {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 22px;

            color: #777;

            font-size: 13px;

            text-decoration: none;

        }


        .back-link:hover {

            color: #ff2d55;

        }


        .back-link i {

            width: 16px;

            height: 16px;

        }


        /* ===============================
           MOBILE
        ================================ */

        @media (max-width: 600px) {

            .header {

                height: 64px;

                padding:
                    0 18px;

            }


            .brand img {

                width: 38px;

                height: 38px;

            }


            .brand-title {

                font-size: 17px;

            }


            .page {

                padding:
                    24px 14px;

                align-items:
                    flex-start;

            }


            .card {

                padding:
                    28px 20px;

                border-radius: 18px;

            }


            .title {

                font-size: 23px;

            }


            input {

                font-size: 16px !important;

            }

        }

    </style>

</head>


<body>


    <!-- ===============================
         HEADER
    ================================ -->

    <header class="header">

        <div class="brand">

            <img
                src="images/logo.png"
                alt="TikTok Shop"
            >

            <div class="brand-text">

                <div class="brand-title">
                    TikTok Shop
                </div>

                <div class="brand-subtitle">
                    Shop • Sell • Grow
                </div>

            </div>

        </div>

    </header>


    <!-- ===============================
         MAIN
    ================================ -->

    <main class="page">

        <section class="card">


            <!-- ===========================
                 STEP 1
            ============================ -->

            <div
                class="step active"
                id="stepVerify"
            >

                <div class="icon-box">

                    <i data-lucide="key-round"></i>

                </div>


                <h1 class="title">
                    ลืมรหัสผ่าน?
                </h1>


                <p class="description">

                    กรอกเบอร์โทรศัพท์หรืออีเมล
                    ที่ใช้สมัครบัญชีของคุณ
                    เพื่อยืนยันบัญชี

                </p>


                <div
                    class="message"
                    id="verifyMessage"
                ></div>


                <div class="field">

                    <label for="contact">
                        อีเมล หรือ เบอร์โทรศัพท์
                    </label>

                    <div class="input-wrapper">

                        <i data-lucide="mail"></i>

                        <input
                            id="contact"
                            type="text"
                            autocomplete="username"
                            placeholder="กรอกอีเมลหรือเบอร์โทรศัพท์"
                        >

                    </div>

                </div>


                <button
                    class="button"
                    id="verifyButton"
                    type="button"
                >
                    ตรวจสอบบัญชี
                </button>


                <a
                    class="back-link"
                    href="auth.html?mode=login"
                >

                    <i data-lucide="arrow-left"></i>

                    กลับไปเข้าสู่ระบบ

                </a>

            </div>


            <!-- ===========================
                 STEP 2
            ============================ -->

            <div
                class="step"
                id="stepReset"
            >

                <div class="icon-box">

                    <i data-lucide="lock-keyhole"></i>

                </div>


                <h1 class="title">
                    ตั้งรหัสผ่านใหม่
                </h1>


                <p class="description">

                    สร้างรหัสผ่านใหม่สำหรับบัญชีของคุณ

                </p>


                <div
                    class="account-info"
                    id="accountInfo"
                ></div>


                <div
                    class="message"
                    id="resetMessage"
                ></div>


                <div class="field">

                    <label for="newPassword">
                        รหัสผ่านใหม่
                    </label>

                    <div class="input-wrapper">

    <i data-lucide="lock"></i>

    <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="อย่างน้อย 6 ตัวอักษร"
    >

    <button
        type="button"
        class="password-toggle"
        id="newPasswordToggle"
        aria-label="แสดงรหัสผ่าน"
    >
        <i data-lucide="eye"></i>
    </button>

</div>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        ยืนยันรหัสผ่านใหม่
                    </label>

                    <div class="input-wrapper">

    <i data-lucide="lock-keyhole"></i>

    <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="กรอกรหัสผ่านอีกครั้ง"
    >

    <button
        type="button"
        class="password-toggle"
        id="confirmPasswordToggle"
        aria-label="แสดงรหัสผ่าน"
    >
        <i data-lucide="eye"></i>
    </button>

</div>

                </div>


                <button
                    class="button"
                    id="resetButton"
                    type="button"
                >
                    เปลี่ยนรหัสผ่าน
                </button>


                <button
                    class="button secondary-button"
                    id="restartButton"
                    type="button"
                >
                    ใช้บัญชีอื่น
                </button>

            </div>


            <!-- ===========================
                 STEP 3
            ============================ -->

            <div
                class="step"
                id="stepSuccess"
            >

                <div class="icon-box">

                    <i data-lucide="circle-check"></i>

                </div>


                <h1 class="title">
                    เปลี่ยนรหัสผ่านสำเร็จ
                </h1>


                <p class="description">

                    รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว
                    ตอนนี้สามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้

                </p>


                <button
                    class="button"
                    id="loginButton"
                    type="button"
                >
                    ไปเข้าสู่ระบบ
                </button>

            </div>


        </section>

    </main>


    <script>

        /* =====================================
           ELEMENTS
        ===================================== */

        const stepVerify =
            document.getElementById(
                "stepVerify"
            );

        const stepReset =
            document.getElementById(
                "stepReset"
            );

        const stepSuccess =
            document.getElementById(
                "stepSuccess"
            );


        const contactInput =
            document.getElementById(
                "contact"
            );

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const newPasswordToggle =
         document.getElementById(
         "newPasswordToggle"
           );

        const confirmPasswordToggle =
          document.getElementById(
          "confirmPasswordToggle"
           );


        const verifyButton =
            document.getElementById(
                "verifyButton"
            );

        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const verifyMessage =
            document.getElementById(
                "verifyMessage"
            );

        const resetMessage =
            document.getElementById(
                "resetMessage"
            );


        const accountInfo =
            document.getElementById(
                "accountInfo"
            );


        let resetToken = "";


        /* =====================================
   PASSWORD SHOW / HIDE
===================================== */

function togglePassword(
    input,
    button
) {

    if (input.type === "password") {

        input.type = "text";

        button.innerHTML =
            '<i data-lucide="eye-off"></i>';

    } else {

        input.type = "password";

        button.innerHTML =
            '<i data-lucide="eye"></i>';

    }

    if (
        window.lucide &&
        window.lucide.createIcons
    ) {
        window.lucide.createIcons();
    }

}


newPasswordToggle.addEventListener(
    "click",
    function () {

        togglePassword(
            newPasswordInput,
            newPasswordToggle
        );

    }
);


confirmPasswordToggle.addEventListener(
    "click",
    function () {

        togglePassword(
            confirmPasswordInput,
            confirmPasswordToggle
        );

    }
);


        /* =====================================
           MESSAGE
        ===================================== */

        function showMessage(
            element,
            message,
            type
        ) {

            element.textContent =
                message;

            element.className =
                "message show " +
                type;

        }


        function hideMessage(element) {

            element.textContent = "";

            element.className =
                "message";

        }


        /* =====================================
           STEP
        ===================================== */

        function showStep(step) {

            stepVerify.classList.remove(
                "active"
            );

            stepReset.classList.remove(
                "active"
            );

            stepSuccess.classList.remove(
                "active"
            );


            step.classList.add(
                "active"
            );

        }


        /* =====================================
           VERIFY ACCOUNT
           POST /api/password-reset/verify
        ===================================== */

        verifyButton.addEventListener(
            "click",
            async function () {

                hideMessage(
                    verifyMessage
                );


                const contact =
                    contactInput.value.trim();


                if (!contact) {

                    showMessage(

                        verifyMessage,

                        "กรุณากรอกอีเมลหรือเบอร์โทรศัพท์",

                        "error"

                    );

                    return;

                }


                verifyButton.disabled =
                    true;

                verifyButton.textContent =
                    "กำลังตรวจสอบ...";


                try {

                    const response =
                        await fetch(
                            "/api/password-reset/verify",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({
                                        contact
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "ไม่สามารถตรวจสอบบัญชีได้"
                        );

                    }


                    resetToken =
                        data.resetToken;


                    accountInfo.innerHTML = `

                        <strong>
                            ${escapeHtml(
                                data.user.username
                            )}
                        </strong>

                        <span>
                            บัญชี:
                            ${escapeHtml(
                                data.user.contact
                            )}
                        </span>

                    `;


                    hideMessage(
                        verifyMessage
                    );


                    showStep(
                        stepReset
                    );


                }

                catch (error) {

                    showMessage(

                        verifyMessage,

                        error.message ||
                        "เกิดข้อผิดพลาด",

                        "error"

                    );

                }

                finally {

                    verifyButton.disabled =
                        false;

                    verifyButton.textContent =
                        "ตรวจสอบบัญชี";

                }

            }
        );


        /* =====================================
           RESET PASSWORD
           POST /api/password-reset/reset
        ===================================== */

        resetButton.addEventListener(
            "click",
            async function () {

                hideMessage(
                    resetMessage
                );


                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (!newPassword) {

                    showMessage(

                        resetMessage,

                        "กรุณากรอกรหัสผ่านใหม่",

                        "error"

                    );

                    return;

                }


                if (
                    newPassword.length < 6
                ) {

                    showMessage(

                        resetMessage,

                        "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",

                        "error"

                    );

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showMessage(

                        resetMessage,

                        "รหัสผ่านทั้งสองช่องไม่ตรงกัน",

                        "error"

                    );

                    return;

                }


                if (!resetToken) {

                    showMessage(

                        resetMessage,

                        "เซสชันหมดอายุ กรุณาตรวจสอบบัญชีใหม่",

                        "error"

                    );

                    showStep(
                        stepVerify
                    );

                    return;

                }


                resetButton.disabled =
                    true;

                resetButton.textContent =
                    "กำลังเปลี่ยนรหัสผ่าน...";


                try {

                    const response =
                        await fetch(
                            "/api/password-reset/reset",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        resetToken,

                                        newPassword,

                                        confirmPassword

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "ไม่สามารถเปลี่ยนรหัสผ่านได้"
                        );

                    }


                    resetToken = "";


                    newPasswordInput.value =
                        "";

                    confirmPasswordInput.value =
                        "";


                    showStep(
                        stepSuccess
                    );

                }

                catch (error) {

                    showMessage(

                        resetMessage,

                        error.message ||
                        "เกิดข้อผิดพลาด",

                        "error"

                    );

                }

                finally {

                    resetButton.disabled =
                        false;

                    resetButton.textContent =
                        "เปลี่ยนรหัสผ่าน";

                }

            }
        );


        /* =====================================
           RESTART
        ===================================== */

        document
            .getElementById(
                "restartButton"
            )
            .addEventListener(
                "click",
                function () {

                    resetToken = "";

                    contactInput.value =
                        "";

                    newPasswordInput.value =
                        "";

                    confirmPasswordInput.value =
                        "";

                    hideMessage(
                        verifyMessage
                    );

                    hideMessage(
                        resetMessage
                    );

                    showStep(
                        stepVerify
                    );

                }
            );


        /* =====================================
           SUCCESS → LOGIN
        ===================================== */

        document
            .getElementById(
                "loginButton"
            )
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "auth.html?mode=login";

                }
            );


        /* =====================================
           ESCAPE HTML
        ===================================== */

        function escapeHtml(value) {

            return String(value || "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           LUCIDE
        ===================================== */

        if (
            window.lucide &&
            window.lucide.createIcons
        ) {

            window.lucide.createIcons();

        }

    </script>

</body>

</html>

                <img

                    onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML=
                        '<span class=&quot;logo-t&quot;>t</span>';

            </div>


            <div class="brand-text">

                <strong>TikTok</strong>

        </div>


        <button

        <a

        <a

                class="notification-count"
                id="messageCount"
                style="display:none;"

                0
            </span>

        <a

             GUEST / SELLER BOX
